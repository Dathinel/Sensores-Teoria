<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Previsualización — taller segundo corte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1013;
    --panel: #15191d;
    --panel-border: #262b31;
    --text: #e7e9ec;
    --text-muted: #8b929b;
    --accent: #4f8fce;
    --verde-ok: #4caf7d;
    --rojo: #d9534f;
    --amarillo: #e8b930;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Space Grotesk", system-ui, sans-serif; }
  body { padding: 1.2rem 1.4rem; min-height: 100vh; }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 0.2rem; }
  p.sub { color: var(--text-muted); font-size: 0.8rem; margin: 0 0 1rem; max-width: 760px; }
  .config-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .config-tabs button {
    background: transparent; color: var(--text-muted); border: 1px solid var(--panel-border);
    padding: 0.5rem 0.9rem; border-radius: 6px; font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; cursor: pointer;
  }
  .config-tabs button.activo { border-color: var(--amarillo); color: var(--amarillo); }
  .rejilla { display: grid; grid-template-columns: minmax(240px, 300px) minmax(220px, 280px) 1fr; gap: 1rem; align-items: start; max-width: 1800px; }
  @media (max-width: 1100px) { .rejilla { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px; padding: 1rem; }
  .modos { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .modos button {
    flex: 1; background: transparent; color: var(--text-muted); border: 1px solid var(--panel-border);
    padding: 0.5rem; border-radius: 6px; font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; cursor: pointer;
  }
  .modos button.activo { border-color: var(--accent); color: var(--accent); }
  #btnConectar {
    width: 100%; background: transparent; color: var(--text); border: 1px solid var(--panel-border);
    padding: 0.5rem; border-radius: 6px; font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; cursor: pointer;
  }
  #estado { font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; color: var(--text-muted); margin-top: 0.5rem; }
  #estado.ok { color: var(--verde-ok); }
  #monitor {
    margin-top: 0.8rem; height: 110px; overflow-y: auto; background: #0a0d10; border: 1px solid var(--panel-border);
    border-radius: 6px; padding: 0.4rem 0.5rem; font-family: "IBM Plex Mono", monospace; font-size: 0.65rem; color: var(--text-muted);
  }
  #monitor div:last-child { color: var(--text); }
  svg { width: 100%; max-height: 46vh; height: auto; background: #0a0d10; border: 1px solid var(--panel-border); border-radius: 8px; }
  .lectura { display: flex; gap: 1rem; margin-top: 0.8rem; font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; color: var(--text-muted); flex-wrap: wrap; }
  .teclado { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
  .teclado button {
    aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--panel-border); background: #1c2126;
    color: var(--text); font-family: "IBM Plex Mono", monospace; font-size: 0.95rem; cursor: pointer;
  }
  .teclado button.activa { border-color: var(--accent); color: var(--accent); }
  .teclado button.deshabilitada { color: #3a3f45; cursor: default; }
  #leyenda { font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; color: var(--amarillo); margin-top: 0.6rem; line-height: 1.5; }
</style>
</head>
<body>

<h1>Previsualización — taller segundo corte</h1>
<p class="sub">Un solo teclado matricial 4x4 (esp32_teclado.py) controla las tres simulaciones del taller, cada una con su propia configuración de teclas. Este panel no reemplaza PyBullet: es un esquema 2D simplificado para probar el control rápido.</p>

<div class="config-tabs">
  <button id="btnConfigDrones" class="activo">Configuración: drones</button>
  <button id="btnConfigBrazo">Configuración: brazo (tipo Baxter)</button>
  <button id="btnConfigPatas">Configuración: locomoción (patas)</button>
</div>

<div class="rejilla">
  <div class="panel">
    <div class="modos">
      <button id="btnModoPrueba" class="activo">Modo prueba</button>
      <button id="btnModoConectado">Conectado (Web Serial)</button>
    </div>
    <button id="btnConectar" style="display:none">Conectar por USB (Web Serial)</button>
    <div id="estado" style="display:none"></div>
    <div id="monitor" style="display:none"></div>
  </div>

  <div class="panel" id="panelControles">
    <div class="teclado" id="teclado"></div>
    <div id="leyenda"></div>
  </div>

  <div class="panel">
    <svg viewBox="0 0 320 320" id="lienzo">
      <g id="capaMarcadores"></g>
      <g id="capaMoviles"></g>
    </svg>
    <div class="lectura" id="lectura"></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------
// Vista 2D "desde arriba" (X a la derecha, Y hacia arriba en pantalla).
// Cada configuracion tiene su propia escala y centro: los drones se
// mueven varios metros, el brazo apenas medio metro (con la escala de
// los drones el efector se movia 1 px por paso y no se veia nada).
// ---------------------------------------------------------------
const VISTAS = {
  drones: { escala: 48, cx: 0.0, cy: -0.3 },   // px por metro, centro del lienzo en metros
  brazo: { escala: 300, cx: 0.5, cy: -0.05 },
  patas: { escala: 120, cx: 0.0, cy: 0.6 },
};
function mundoAPantalla(x, y) {
  const v = VISTAS[configActiva];
  return [160 + (x - v.cx) * v.escala, 160 - (y - v.cy) * v.escala];
}

const SVG = "http://www.w3.org/2000/svg";
const capaMarcadores = document.getElementById("capaMarcadores");
const capaMoviles = document.getElementById("capaMoviles");
const lectura = document.getElementById("lectura");
const leyenda = document.getElementById("leyenda");
const teclado = document.getElementById("teclado");
const TECLAS = [["1","2","3","A"],["4","5","6","B"],["7","8","9","C"],["*","0","#","D"]];

function limpiarSvg() { capaMarcadores.innerHTML = ""; capaMoviles.innerHTML = ""; }
function elemento(tipo, attrs, capa) {
  const e = document.createElementNS(SVG, tipo);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  capa.appendChild(e);
  return e;
}
function ejes() {
  const [ox, oy] = mundoAPantalla(0, 0);
  elemento("line", { x1: ox, y1: 0, x2: ox, y2: 320, stroke: "#1c2126" }, capaMarcadores);
  elemento("line", { x1: 0, y1: oy, x2: 320, y2: oy, stroke: "#1c2126" }, capaMarcadores);
}
function marcador(x, y, color, etiqueta, radio = 10) {
  const [px, py] = mundoAPantalla(x, y);
  elemento("circle", { cx: px, cy: py, r: radio, fill: color, "fill-opacity": "0.3", stroke: color }, capaMarcadores);
  if (etiqueta) {
    const t = elemento("text", { x: px, y: py - radio - 4, fill: color, "font-size": 11, "text-anchor": "middle",
                                 "font-family": "IBM Plex Mono, monospace" }, capaMarcadores);
    t.textContent = etiqueta;
  }
}
function punto(x, y, color, radio) {
  const [px, py] = mundoAPantalla(x, y);
  elemento("circle", { cx: px, cy: py, r: radio, fill: color }, capaMoviles);
}
const limitar = (v, a, b) => Math.max(a, Math.min(b, v));
const dist3 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);

// ---------------------------------------------------------------
// Configuracion A: drones (mismas constantes que drones_pybullet.py)
//   8/2 = Y+/Y-, 4/6 = X-/X+, 9/7 = subir/bajar, 5 = detener
//   A/B/C = ir al punto, D = home, * = despegar, # = aterrizar
//   0 = mision automatica A -> B -> C (cualquier otra orden la cancela)
// En PyBullet vuelan con fisica real (inclinarse, pasarse y corregir);
// aca el lider solo se acerca al objetivo con un filtro de primer
// orden: sirve para probar el CONTROL, no el vuelo.
// ---------------------------------------------------------------
const PUNTOS_DRON = { A: [0.0, 0.9, 1.2], B: [1.4, -0.6, 1.6], C: [-1.3, 0.4, 0.9] };
const ORIGEN_DRON = [0, 0, 0.03];
const ALTURA_VUELO = 1.0, ALTURA_SUELO = 0.03;
const PASO_DRON = 0.10;
const OFFSET_SEGUIDORES = [[-0.7, -0.6], [0.7, -0.6], [-1.4, -1.2], [1.4, -1.2]];  // formacion en V
let posLider = [...ORIGEN_DRON];
let objetivoLider = [...ORIGEN_DRON];
let mision = [];

function teclaDrones(t) {
  const o = objetivoLider;
  if (t !== "0" && "82469757ABCD*#".includes(t)) mision = [];
  if (t === "8") o[1] += PASO_DRON;
  else if (t === "2") o[1] -= PASO_DRON;
  else if (t === "4") o[0] -= PASO_DRON;
  else if (t === "6") o[0] += PASO_DRON;
  else if (t === "9") o[2] += PASO_DRON;
  else if (t === "7") o[2] = Math.max(ALTURA_SUELO, o[2] - PASO_DRON);
  else if (t === "5") objetivoLider = [...posLider];
  else if (t in PUNTOS_DRON) objetivoLider = [...PUNTOS_DRON[t]];
  else if (t === "D") objetivoLider = [...ORIGEN_DRON];
  else if (t === "*") o[2] = ALTURA_VUELO;
  else if (t === "#") o[2] = ALTURA_SUELO;
  else if (t === "0") { mision = ["A", "B", "C"]; objetivoLider = [...PUNTOS_DRON.A]; }
}

function dibujarDrones() {
  limpiarSvg(); ejes();
  Object.entries(PUNTOS_DRON).forEach(([n, [x, y, z]]) => marcador(x, y, "#4f8fce", `${n} (z ${z})`));
  marcador(ORIGEN_DRON[0], ORIGEN_DRON[1], "#8b929b", "home", 7);
  const antes = [...posLider];
  for (let i = 0; i < 3; i++) posLider[i] += (objetivoLider[i] - posLider[i]) * 0.12;
  // mision: pasa al siguiente punto al llegar a 12 cm y casi quieto (como el script)
  if (mision.length) {
    const vel = dist3(posLider, antes) / 0.05;
    if (dist3(posLider, PUNTOS_DRON[mision[0]]) < 0.12 && vel < 0.3) {
      mision.shift();
      if (mision.length) objetivoLider = [...PUNTOS_DRON[mision[0]]];
    }
  }
  OFFSET_SEGUIDORES.forEach(([dx, dy]) => punto(posLider[0] + dx, posLider[1] + dy, "#4f8fce", 5));
  // el radio del lider crece con la altura: la unica pista de Z en una vista desde arriba
  punto(posLider[0], posLider[1], "#d9534f", 5 + posLider[2] * 3);
  lectura.innerHTML = `<span>X: ${posLider[0].toFixed(2)} m</span><span>Y: ${posLider[1].toFixed(2)} m</span>` +
    `<span>Z: ${posLider[2].toFixed(2)} m</span><span>${mision.length ? "mision: va a " + mision[0] : "manual"}</span>`;
}

// ---------------------------------------------------------------
// Configuracion B: brazo tipo Baxter (mismas constantes que brazo_pybullet.py)
//   8/2 = Y+/Y-, 4/6 = X-/X+, 9/7 = Z+/Z-, 5 = home
//   A = abrir pinza (suelta), C = cerrar pinza (agarra si el cubo esta cerca)
//   D = demo coger y mover, B = demo recorrer los 3 ejes, 0 = reset del cubo
// La vista es desde arriba; la altura Z del efector se ve en la barra
// de la derecha (y en la lectura de abajo).
// ---------------------------------------------------------------
const POS_ORIGEN = [0.55, 0.20], POS_DESTINO = [0.55, -0.30];
const HOME_EFECTOR = [0.537, 0.0, 0.35];
const PASO_BRAZO = 0.015;
const LIMITES_JOG = [[0.30, 0.68], [-0.40, 0.40], [0.07, 0.60]];
const OFFSET_PINZA_SOBRE_CUBO = 0.24;   // la muneca (el "efector" de la IK) queda 0.24 m sobre el cubo agarrado
const UMBRAL_AGARRE = 0.32;             // distancia 3D muneca-cubo maxima para agarrar
const Z_CUBO_BANDEJA = -0.159, Z_CUBO_DESTINO = -0.135, Z_CUBO_PISO = -0.625;
let efector = [...HOME_EFECTOR];
let pinzaAbierta = true;
let cubo = [POS_ORIGEN[0], POS_ORIGEN[1], Z_CUBO_BANDEJA];
let cuboSostenido = false;
let demoEnCurso = false;

function alturaApoyo(x, y) {
  // donde cae el cubo al soltarlo: plataforma de destino (16x16 cm),
  // bandeja de origen (ancha, ~50 cm) o, fuera de las dos, el piso
  if (Math.abs(x - POS_DESTINO[0]) <= 0.08 && Math.abs(y - POS_DESTINO[1]) <= 0.08) return Z_CUBO_DESTINO;
  if (Math.abs(x - POS_ORIGEN[0]) <= 0.25 && Math.abs(y - POS_ORIGEN[1]) <= 0.25) return Z_CUBO_BANDEJA;
  return Z_CUBO_PISO;
}
function soltarCubo() {
  if (!cuboSostenido) return;
  cuboSostenido = false;
  cubo[2] = alturaApoyo(cubo[0], cubo[1]);
}
function intentarAgarrar() {
  if (!cuboSostenido && dist3(efector, cubo) <= UMBRAL_AGARRE) cuboSostenido = true;
}

function teclaBrazo(t) {
  if (demoEnCurso) return;   // igual que el script: la demo bloquea todo mientras corre
  if (t === "8") efector[1] += PASO_BRAZO;
  else if (t === "2") efector[1] -= PASO_BRAZO;
  else if (t === "4") efector[0] -= PASO_BRAZO;
  else if (t === "6") efector[0] += PASO_BRAZO;
  else if (t === "9") efector[2] += PASO_BRAZO;
  else if (t === "7") efector[2] -= PASO_BRAZO;
  else if (t === "5") efector = [...HOME_EFECTOR];
  else if (t === "A") { pinzaAbierta = true; soltarCubo(); }
  else if (t === "C") { pinzaAbierta = false; intentarAgarrar(); }
  else if (t === "D") ejecutarDemoBrazo();
  else if (t === "B") ejecutarDemoRecorrido();
  else if (t === "0") { cuboSostenido = false; cubo = [POS_ORIGEN[0], POS_ORIGEN[1], Z_CUBO_BANDEJA]; }
  efector = efector.map((v, i) => limitar(v, ...LIMITES_JOG[i]));
}

const espera = (ms) => new Promise((r) => setTimeout(r, ms));
async function moverA(xyz, ms) { efector = [...xyz]; await espera(ms); }

async function ejecutarDemoBrazo() {
  // misma secuencia que ejecutar_demo(): va a donde ESTE el cubo, lo
  // agarra, lo lleva a la plataforma y lo suelta (tiempos acortados)
  demoEnCurso = true;
  const [xc, yc] = cubo;
  const viaje = HOME_EFECTOR[2];
  pinzaAbierta = true; await espera(200);
  await moverA([xc, yc, viaje], 450);
  await moverA([xc, yc, Z_CUBO_BANDEJA + OFFSET_PINZA_SOBRE_CUBO], 450);
  pinzaAbierta = false; intentarAgarrar(); await espera(250);
  await moverA([xc, yc, viaje], 450);
  await moverA([POS_DESTINO[0], POS_DESTINO[1], viaje], 600);
  await moverA([POS_DESTINO[0], POS_DESTINO[1], Z_CUBO_DESTINO + OFFSET_PINZA_SOBRE_CUBO], 450);
  soltarCubo(); pinzaAbierta = true; await espera(250);
  await moverA([POS_DESTINO[0], POS_DESTINO[1], viaje], 450);
  demoEnCurso = false;
}

async function ejecutarDemoRecorrido() {
  demoEnCurso = true;
  const [x0, y0, z0] = HOME_EFECTOR;
  const recorrido = [HOME_EFECTOR, [x0 + 0.13, y0, z0], [x0 - 0.19, y0, z0], HOME_EFECTOR,
                     [x0, y0 + 0.3, z0], [x0, y0 - 0.3, z0], HOME_EFECTOR,
                     [x0, y0, 0.55], [x0, y0, 0.08], HOME_EFECTOR];
  for (const p of recorrido) await moverA(p, 380);
  demoEnCurso = false;
}

function dibujarBrazo() {
  limpiarSvg();
  // caja de trabajo del jog
  const [x1, y1] = mundoAPantalla(LIMITES_JOG[0][0], LIMITES_JOG[1][1]);
  const [x2, y2] = mundoAPantalla(LIMITES_JOG[0][1], LIMITES_JOG[1][0]);
  elemento("rect", { x: x1, y: y1, width: x2 - x1, height: y2 - y1, fill: "none", stroke: "#262b31",
                     "stroke-dasharray": "4 4" }, capaMarcadores);
  marcador(...POS_ORIGEN, "#4f8fce", "ORIGEN (bandeja)", 24);
  marcador(...POS_DESTINO, "#4caf7d", "DESTINO", 24);
  if (cuboSostenido) cubo = [efector[0], efector[1], efector[2] - OFFSET_PINZA_SOBRE_CUBO];
  punto(cubo[0], cubo[1], cubo[2] < -0.5 ? "#7a6420" : "#e8b930", 7);
  const [ex, ey] = mundoAPantalla(efector[0], efector[1]);
  elemento("circle", { cx: ex, cy: ey, r: 10, fill: "none", "stroke-width": 3,
                       stroke: pinzaAbierta ? "#4f8fce" : "#d9534f" }, capaMoviles);
  // barra de altura (Z) a la derecha: 0.07 abajo, 0.60 arriba
  const frac = (efector[2] - LIMITES_JOG[2][0]) / (LIMITES_JOG[2][1] - LIMITES_JOG[2][0]);
  elemento("rect", { x: 300, y: 20, width: 8, height: 280, fill: "#15191d", stroke: "#262b31" }, capaMoviles);
  elemento("rect", { x: 300, y: 300 - frac * 280 - 3, width: 8, height: 6, fill: "#e7e9ec" }, capaMoviles);
  const distancia = dist3(efector, cubo);
  lectura.innerHTML = `<span>X: ${efector[0].toFixed(3)}</span><span>Y: ${efector[1].toFixed(3)}</span>` +
    `<span>Z: ${efector[2].toFixed(3)} m</span><span>Pinza: ${pinzaAbierta ? "abierta" : "cerrada"}</span>` +
    `<span>Cubo: ${cuboSostenido ? "agarrado" : (cubo[2] < -0.5 ? "en el piso (0 = reponer)" : "apoyado")}</span>` +
    `<span>dist. muneca-cubo: ${distancia.toFixed(2)} m ${!cuboSostenido && distancia <= UMBRAL_AGARRE ? "(C lo agarra)" : ""}</span>`;
}

// ---------------------------------------------------------------
// Configuracion C: locomocion (mismas reglas que laikago_pybullet.py)
//   8 (sostenida) = trotar; al soltar frena con rampa de 0.6 s
//   4 / 6 (sostenidas) = girar izquierda/derecha (frena el trote antes)
//   5 = reset
// La velocidad (~6 cm/s) y el giro (0.015 rad por linea, ~17 grados/s)
// son los medidos en el script con fisica real.
// ---------------------------------------------------------------
const VELOCIDAD_TROTE = 0.06;   // m/s con el trote a intensidad completa
const RAMPA_TROTE = 0.6;        // s para pasar de parado a trote completo (y al reves)
const PASO_GIRO = 0.015;        // rad por linea recibida
let posPatas = [0, 0];
let rumbo = 0;                  // rad, 0 = hacia +Y ("arriba" en el lienzo), positivo = a la izquierda
let caminando = false;
let intensidad = 0;
let rastro = [];

function frenarDelTodo() { caminando = false; intensidad = 0; }

function teclaPatas(t) {
  // se llama SOLO con los flancos/repeticiones que correspondan (ver procesarTeclaRecibida)
  if (t === "8") caminando = true;
  else if (t === "suelta8") caminando = false;
  else if (t === "4") { frenarDelTodo(); rumbo += PASO_GIRO; }
  else if (t === "6") { frenarDelTodo(); rumbo -= PASO_GIRO; }
  else if (t === "5") { posPatas = [0, 0]; rumbo = 0; frenarDelTodo(); rastro = []; }
}

function dibujarPatas() {
  limpiarSvg(); ejes();
  const dt = 0.05;
  intensidad = limitar(intensidad + (caminando ? 1 : -1) * dt / RAMPA_TROTE, 0, 1);
  if (intensidad > 0) {
    posPatas[0] += -Math.sin(rumbo) * VELOCIDAD_TROTE * intensidad * dt;
    posPatas[1] += Math.cos(rumbo) * VELOCIDAD_TROTE * intensidad * dt;
    if (!rastro.length || Math.hypot(posPatas[0] - rastro.at(-1)[0], posPatas[1] - rastro.at(-1)[1]) > 0.02) {
      rastro.push([...posPatas]);
      if (rastro.length > 300) rastro.shift();
    }
  }
  rastro.forEach(([x, y]) => punto(x, y, "#2f5f45", 1.5));
  const [px, py] = mundoAPantalla(posPatas[0], posPatas[1]);
  const cuerpo = elemento("g", { transform: `translate(${px} ${py}) rotate(${(-rumbo * 180 / Math.PI).toFixed(1)})` }, capaMoviles);
  elemento("polygon", { points: "0,-13 9,10 -9,10", fill: intensidad > 0 ? "#4caf7d" : "#8b929b" }, cuerpo);
  const estado = intensidad === 0 ? "parado" : (caminando ? (intensidad < 1 ? "arrancando" : "trotando") : "frenando");
  lectura.innerHTML = `<span>X: ${posPatas[0].toFixed(2)} m</span><span>Y: ${posPatas[1].toFixed(2)} m</span>` +
    `<span>Rumbo: ${(rumbo * 180 / Math.PI).toFixed(0)}&deg; (+ = izquierda)</span><span>${estado} (${Math.round(intensidad * 100)}%)</span>`;
}

// ---------------------------------------------------------------
// Configuracion activa + teclado clicable + Web Serial (un solo puerto,
// compartido por las 3 configuraciones: un solo ESP32 real)
// ---------------------------------------------------------------
let configActiva = "drones";

const LEYENDAS = {
  drones: "8/2 = adelante/atras &middot; 4/6 = izq/der &middot; 9/7 = subir/bajar &middot; 5 = detener<br>A/B/C = ir al punto &middot; D = home &middot; * = despegar &middot; # = aterrizar &middot; 0 = mision A&rarr;B&rarr;C",
  brazo: "8/2 = Y+/Y- &middot; 4/6 = X-/X+ &middot; 9/7 = subir/bajar (mantener) &middot; 5 = home<br>A = abrir pinza &middot; C = cerrar/agarrar &middot; D = demo coger y mover &middot; B = demo 3 ejes &middot; 0 = reponer cubo",
  patas: "8 (mantener) = trotar, al soltar frena<br>4 / 6 (mantener) = girar izquierda/derecha &middot; 5 = reset",
};
const TECLAS_ACTIVAS = {
  drones: new Set(["8","2","4","6","9","7","5","A","B","C","D","*","#","0"]),
  brazo: new Set(["8","2","4","6","9","7","5","A","B","C","D","0"]),
  patas: new Set(["8","4","6","5"]),
};
// teclas que se REPITEN mientras se sostienen (como el ESP32, que reenvia
// la tecla sostenida cada ~50 ms). En el brazo y el Laikago, las demas
// son "de un solo golpe": solo cuentan en el flanco, igual que en sus scripts.
const TECLAS_REPETIDAS = {
  drones: null,                                   // drones_pybullet.py procesa cada linea tal cual
  brazo: new Set(["8","2","4","6","9","7"]),
  patas: new Set(["4","6"]),
};
const TECLAS_SOSTENIBLES = {
  drones: new Set(["8","2","4","6","9","7"]),
  brazo: new Set(["8","2","4","6","9","7"]),
  patas: new Set(["8","4","6"]),
};
let teclaAnterior = "-";

// Punto de entrada UNICO de una tecla (venga del teclado clicable o de
// una linea "TECLA:x" del ESP32): aplica la misma regla de flancos que
// los scripts de Python, asi el preview se comporta igual que PyBullet.
function procesarTeclaRecibida(t) {
  const anterior = teclaAnterior;
  teclaAnterior = t;
  const repetidas = TECLAS_REPETIDAS[configActiva];
  if (configActiva === "patas") {
    if (t === "8" && anterior !== "8") teclaPatas("8");
    else if (anterior === "8" && t !== "8") teclaPatas("suelta8");
    if (t === "4" || t === "6") teclaPatas(t);
    else if (t === "5" && anterior !== "5") teclaPatas("5");
    return;
  }
  if (t === "-") return;
  if (repetidas && !repetidas.has(t) && t === anterior) return;   // tecla de un golpe, sostenida: ya se ejecuto
  if (configActiva === "drones") teclaDrones(t); else teclaBrazo(t);
}

function construirTeclado() {
  teclado.innerHTML = "";
  TECLAS.flat().forEach((tecla) => {
    const boton = document.createElement("button");
    boton.textContent = tecla;
    boton.dataset.tecla = tecla;
    let intervalo = null;
    const empezar = (ev) => {
      ev.preventDefault();
      if (boton.disabled) return;
      boton.classList.add("activa");
      procesarTeclaRecibida(tecla);
      if (TECLAS_SOSTENIBLES[configActiva].has(tecla)) {
        intervalo = setInterval(() => procesarTeclaRecibida(tecla), 50);
      } else {
        // un click en una tecla de un golpe = pulsar y soltar (como el ESP32: "TECLA:x" y luego "TECLA:-")
        procesarTeclaRecibida("-");
        setTimeout(() => boton.classList.remove("activa"), 120);
      }
    };
    const soltar = () => {
      if (!intervalo) return;
      clearInterval(intervalo); intervalo = null;
      procesarTeclaRecibida("-");
      boton.classList.remove("activa");
    };
    boton.addEventListener("mousedown", empezar);
    boton.addEventListener("touchstart", empezar);
    ["mouseup", "mouseleave", "touchend"].forEach((ev) => boton.addEventListener(ev, soltar));
    teclado.appendChild(boton);
  });
  const activas = TECLAS_ACTIVAS[configActiva];
  teclado.querySelectorAll("button").forEach((b) => {
    const habilitada = activas.has(b.dataset.tecla);
    b.classList.toggle("deshabilitada", !habilitada);
    b.disabled = !habilitada;
  });
  leyenda.innerHTML = LEYENDAS[configActiva];
}

function refrescar() {
  if (configActiva === "drones") dibujarDrones();
  else if (configActiva === "brazo") dibujarBrazo();
  else dibujarPatas();
}

const botonesConfig = { drones: "btnConfigDrones", brazo: "btnConfigBrazo", patas: "btnConfigPatas" };
Object.entries(botonesConfig).forEach(([nombre, id]) => {
  document.getElementById(id).addEventListener("click", () => {
    configActiva = nombre;
    teclaAnterior = "-";
    Object.values(botonesConfig).forEach((otro) => document.getElementById(otro).classList.toggle("activo", otro === id));
    construirTeclado();
  });
});

construirTeclado();
setInterval(refrescar, 50);

// -------- modos (prueba / conectado) --------
const btnModoPrueba = document.getElementById("btnModoPrueba");
const btnModoConectado = document.getElementById("btnModoConectado");
const panelControles = document.getElementById("panelControles");
const btnConectar = document.getElementById("btnConectar");
const estado = document.getElementById("estado");
const monitor = document.getElementById("monitor");
let modoConectado = false;

btnModoPrueba.addEventListener("click", () => {
  modoConectado = false;
  btnModoPrueba.classList.add("activo"); btnModoConectado.classList.remove("activo");
  panelControles.style.opacity = "1"; panelControles.style.pointerEvents = "auto";
  btnConectar.style.display = "none"; estado.style.display = "none"; monitor.style.display = "none";
});

btnModoConectado.addEventListener("click", () => {
  modoConectado = true;
  btnModoConectado.classList.add("activo"); btnModoPrueba.classList.remove("activo");
  // con el ESP32 manda el teclado fisico: el clicable queda solo como referencia
  panelControles.style.opacity = "0.6"; panelControles.style.pointerEvents = "none";
  btnConectar.style.display = "block"; estado.style.display = "block"; monitor.style.display = "block";
  if (!puerto) { estado.textContent = "sin conectar"; estado.classList.remove("ok"); }
});

// -------- Web Serial: un solo puerto (un solo ESP32 con esp32_teclado.py),
// 115200 baudios, lineas "TECLA:x" / "TECLA:-" cada ~50 ms --------
let puerto = null;
const patronLinea = /^TECLA:(.)$/;

function agregarAlMonitor(linea) {
  // linea CRUDA tal cual llego: si nunca cambia, el ESP32 no manda nada;
  // si cambia pero no es "TECLA:x", el problema es de formato, no de cable
  const div = document.createElement("div");
  div.textContent = linea;
  monitor.appendChild(div);
  monitor.scrollTop = monitor.scrollHeight;
  while (monitor.childNodes.length > 40) monitor.removeChild(monitor.firstChild);
}

btnConectar.addEventListener("click", async () => {
  if (!("serial" in navigator)) {
    estado.textContent = "Web Serial no disponible (usa Chrome o Edge)";
    return;
  }
  if (puerto) return;
  try {
    puerto = await navigator.serial.requestPort();
    await puerto.open({ baudRate: 115200 });
    estado.textContent = "conectado, esperando datos del ESP32...";
    estado.classList.add("ok");
    leerPuerto();
  } catch (error) {
    puerto = null;
    estado.textContent = "no se pudo conectar: " + error.message;
  }
});

async function leerPuerto() {
  const lector = puerto.readable.getReader();
  const decodificador = new TextDecoder();
  let bufferTexto = "";
  try {
    while (true) {
      const { value, done } = await lector.read();
      if (done) break;
      bufferTexto += decodificador.decode(value, { stream: true });
      let indice;
      while ((indice = bufferTexto.indexOf("\n")) >= 0) {   // puede llegar mas de una linea junta: se procesan todas
        const linea = bufferTexto.slice(0, indice).trim();
        bufferTexto = bufferTexto.slice(indice + 1);
        if (!linea) continue;
        agregarAlMonitor(linea);
        const coincidencia = patronLinea.exec(linea);
        if (coincidencia && modoConectado) {
          procesarTeclaRecibida(coincidencia[1]);
          estado.textContent = "recibiendo datos del ESP32";
        }
      }
    }
  } catch (error) {
    estado.textContent = "conexion perdida: " + error.message;
    estado.classList.remove("ok");
  } finally {
    lector.releaseLock();
    try { await puerto.close(); } catch (e) { /* ya estaba cerrado */ }
    puerto = null;
  }
}
