<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor 3D de la planta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Sistema de diseño de la interfaz (app/portable.py lo mete adentro del archivo portable). -->
<link rel="stylesheet" href="./estilo.css">
</head>
<body>
<!-- Esqueleto de la interfaz: el contenido lo llena interfaz.js; la escena 3D va en #lienzo. -->
<div id="lienzo"></div>

<header id="barra">
  <div class="marca"><span class="moneda" aria-hidden="true"></span><b>Planta de monedas</b><span class="sub">visor 3D</span></div>
  <div class="chips">
    <span id="chipEstado" class="chip">conectando…</span>
    <span id="chipTick" class="chip sin-punto">tick —</span>
    <span id="chipRed" class="chip" title="Sin internet solo cambia el asistente: responde el modelo local de la laptop">revisando internet…</span>
  </div>
  <span class="espacio"></span>
  <div class="acciones">
    <button id="btnCables" title="Muestra u oculta todo el cableado y su leyenda"><span class="icono" aria-hidden="true">⚡</span><span class="texto">Cables</span></button>
    <button id="btnPanel" class="activo" title="Muestra u oculta el panel lateral"><span class="icono" aria-hidden="true">☰</span><span class="texto">Panel</span></button>
  </div>
</header>

<!-- Vistas: llevan la cámara a cada sección (no cambian nada de la planta). -->
<nav id="vistas" aria-label="Vistas de la cámara">
  <span class="rotulo">Ver</span>
  <span class="grupo-vista">
    <button data-vista="todo" title="Todo el sistema">Todo</button>
    <button data-vista="planta" title="Las dos cintas, el almacén y el pórtico">Planta</button>
  </span>
  <span class="grupo-vista" title="Línea de monedas">
    <button data-vista="monedas" title="Cinta de monedas: presencia, visión y descarga">Monedas</button>
    <button data-vista="material" title="Sensores capacitivo e inductivo, debajo de la cinta">Material</button>
    <button data-vista="almacen" title="Almacén tipo revólver, Hall y obturador">Almacén</button>
  </span>
  <span class="grupo-vista" title="Línea de vasos">
    <button data-vista="vasos" title="Cinta de vasos: verificación, llenado, tapa, prensa y descarga">Vasos</button>
    <button data-vista="tapa" title="Tubo de tapas, prensa y cortina de seguridad">Tapa y prensa</button>
    <button data-vista="canaleta" title="Canaleta de entrega y muelle de carga">Canaleta</button>
  </span>
  <span class="grupo-vista" title="Carro">
    <button data-vista="carro" title="El carro, donde esté ahora (la cámara lo sigue)">Carro</button>
    <button data-vista="pista" title="Pista con los 3 obstáculos y la meta">Pista</button>
  </span>
  <span class="grupo-vista">
    <button data-vista="caja" title="Caja de control: ESP32, drivers, fuente y bornera">Caja de control</button>
    <button data-vista="asistente" title="Lo último que respondió el asistente (solo lectura)">Asistente</button>
  </span>
</nav>

<aside id="panel" aria-label="Panel">
  <nav id="pestanas" role="tablist">
    <button data-pestana="vivo" class="activo" title="Cómo va la línea ahora">En vivo</button>
    <button data-pestana="pruebas" title="Todos los controles: línea, filtros, piezas, sabotajes, carro y fin de turno">Pruebas</button>
    <button data-pestana="pasos" title="La secuencia punto por punto">Paso a paso</button>
    <button data-pestana="sensores" title="Qué hace cada sensor y cómo probarlo">Sensores</button>
    <button data-pestana="componentes" title="Lista de materiales por subsistema">Componentes</button>
  </nav>
  <div id="contenido"></div>
  <div id="respuestaOrden" aria-live="polite"></div>
</aside>

<div id="modo" aria-live="polite"></div>
<div id="aviso" aria-live="polite"></div>

<section id="bitacora" class="flotante">
  <header>Eventos <span class="cuenta">lo último primero</span><button id="btnBitacora" title="Pliega o abre la bitácora">Plegar</button></header>
  <div id="eventos" class="cuerpo"></div>
</section>
<section id="leyendaCables" class="flotante" hidden></section>
<div id="ayuda">arrastrar: girar · rueda: zoom · clic derecho: mover · clic en un sensor: ver qué hace</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./visor.js"></script>
</body>
</html>
