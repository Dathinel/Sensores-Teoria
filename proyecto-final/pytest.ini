# Configuracion de pytest del proyecto final (correr desde esta carpeta:
#   entorno\Scripts\python -m pytest -q
# o una sola capa: ... -m pytest -q tests/control).
#
# pythonpath = . hace que `control`, `sim`, `app`, `firmware` y `vision` se importen sin instalar
# el paquete (antes lo hacia un conftest.py en la raiz; el de tests/conftest.py solo cierra los
# mundos de PyBullet que queden abiertos entre archivos). tests/ y sus subcarpetas NO llevan
# __init__.py, para que pytest use nombres de prueba simples: por eso cada archivo de prueba debe
# tener un nombre unico en todo tests/ (no puede haber dos test_x.py en carpetas distintas).
[pytest]
testpaths = tests
pythonpath = .
