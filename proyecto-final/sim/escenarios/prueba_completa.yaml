nombre: prueba_completa
descripcion: >
  La UNICA prueba de la linea (usuario, 2026-09-26): un turno completo que
  junta todo lo que antes estaba repartido en varias pruebas. 24 monedas
  colombianas (6 de 500, 5 de 200, 5 de 100, 5 de 50 y 3 de 1000, de ambas
  familias) y un caso de CADA filtro de rechazo: no metalico (botones de
  plastico), perforado, fuera de rango (10 mm y 32 mm), no circular
  (bloque metalico), no reconocida (moneda de 1 euro y dos monedas de series
  viejas que el clasificador todavia no conoce -- TEMPORAL: cuando se
  entrenen iran al vaso de "otras"), incoherente (cara de $500 con otro
  diametro), dos casillas vacias y dos sabotajes de mano en la casilla de
  carga. Los demas sabotajes (retirar o cambiar un vaso, manos en la
  cortina, vaso con algo adentro) se disparan con los botones del visor o
  del dashboard durante la corrida.
  Con lotes de 5 monedas por vaso, se llenan vasos de 500, 200, 100 y 50 --
  cada uno de una sola denominacion -- y lo que no completa lote (1 de 500 y
  3 de 1000) queda guardado en su tubo: ninguna moneda aceptada se descarta.

elementos:
  - tipo: moneda   # serie historica: el modelo aun no la conoce -> no_reconocida (TEMPORAL)
    clase_real: 20_historica
    destino_esperado: rechazo
