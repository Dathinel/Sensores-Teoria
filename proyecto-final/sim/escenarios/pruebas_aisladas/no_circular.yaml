nombre: no_circular
descripcion: >
  Filtro aislado de circularidad, CLAUDE.md seccion 7 (umbral 0.90): se
  lleva bloques y fichas irregulares. Usa un bloque METALICO a proposito
  (metal=true) para que pase la estacion de material y el rechazo se deba
  solo a la forma, no al material -- un bloque de plastico normal ya
  saldria por el la bandeja de rechazo sin necesitar este filtro.

elementos:
  - tipo: bloque
    metal: true
    circularidad: 0.55
    destino_esperado: rechazo
  - tipo: vacia
  - tipo: bloque
    metal: true
    circularidad: 0.70
    destino_esperado: rechazo
