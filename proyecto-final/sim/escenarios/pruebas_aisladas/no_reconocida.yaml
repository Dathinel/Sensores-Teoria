nombre: no_reconocida
descripcion: >
  Filtro aislado de clasificacion, CLAUDE.md seccion 7 (confianza minima
  0.85, clase 'otro'). Discos metalicos redondos, sin agujero, de diametro
  valido -- geometricamente pasarian -- pero sin clase_real (el oraculo
  siempre los clasifica como 'otro', como pasaria con una moneda
  extranjera o un boton que ningun modelo reconoce). El primer elemento
  usa el diametro de una moneda de un euro (23.25 mm, CLAUDE.md seccion 6):
  cae justo en el rango de las de 500 pesos, para dejar claro que la
  decision es por reconocimiento de cara, no por geometria.

elementos:
  - tipo: boton_metalico
    metal: true
    diametro_mm: 23.25
    circularidad: 0.98
    contornos_internos: 0
    destino_esperado: rechazo
  - tipo: vacia
  - tipo: boton_metalico
    metal: true
    diametro_mm: 22.25
    circularidad: 0.97
    contornos_internos: 0
    destino_esperado: rechazo
