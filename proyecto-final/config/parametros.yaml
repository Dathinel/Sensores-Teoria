# Parametros de configuracion del sistema (CLAUDE.md, seccion 17: "todo
# numero magico va a configuracion"). No hardcodear estos valores en el
# codigo; leerlos de aqui.
#
# Los valores marcados "PROVISIONAL" son medidas fisicas reales que todavia
# no se han tomado sobre las piezas que se van a imprimir/comprar. Se usan
# para poder avanzar el URDF y la simulacion (fase 2 en adelante) sin
# bloquear el trabajo, pero deben reemplazarse por la medida real antes de
# construir el modulo fisico correspondiente.

filtrado:
  # Etapa de geometria (seccion 7): rango de diametro aceptado, en mm.
  diametro_min_mm: 16.5
  diametro_max_mm: 27.5
  # Etapa de geometria: circularidad minima (1.0 = circulo perfecto).
  circularidad_minima: 0.90
  # Etapa de clasificacion: confianza minima del modelo para aceptar.
  confianza_minima: 0.85
  # Etapa de coherencia: diferencia maxima tolerada entre el diametro medido
  # y el diametro nominal de la clase predicha, en mm.
  tolerancia_coherencia_mm: 1.2

cinta_monedas:
  # Separacion entre casillas de la cinta indexada, en mm.
  separacion_casilla_mm: 40
  # La pausa tras cada avance esta en tiempos_ms.pausa_casilla_monedas (1000 ms). Aqui habia
  # otra de 300 ms que nadie leia y contradecia esa (auditoria 2026-09-27).

vasos:
  # Sensor del interior del vaso (VL53L0X mirando hacia abajo, en la
  # verificacion): si la distancia al fondo es menor que la del vaso vacio
  # menos este margen (mm), el vaso trae algo adentro y no entra. PROVISIONAL.
  margen_interior_mm: 10
  # PROVISIONAL: el sensor del interior va 15 mm sobre la boca del vaso (revision final
  # 2026-09-26); con el vaso de 90 mm el fondo vacio queda a ~105 mm. Lo usan el visor
  # (sim/geometria.py) y el backend real (umbral = fondo - margen_interior_mm).
  sensor_interior_sobre_boca_mm: 15
  # PROVISIONAL: altura total del vaso a imprimir/comprar, en mm. Ajustar
  # con la medida real antes de la fase 2 (construccion del URDF).
  altura_mm: 90
  # PROVISIONAL: diametro exterior del vaso, en mm.
  diametro_mm: 62
  # PROVISIONAL: altura del separador de la cinta de vasos, en mm. Debe
  # quedar por debajo del reborde de la boca del vaso para no estorbar el
  # colgado en la canaleta (seccion 4).
  separador_altura_mm: 15
  # PROVISIONAL (se deriva del diametro del vaso, que tambien lo es):
  # separacion entre casillas de la cinta de vasos, en mm. Tiene que encajar
  # la base del vaso con margen; no puede ser la misma de la cinta de
  # monedas (40 mm) porque dos vasos de 62 mm quedarian encimados. Si
  # cambia, regenerar sim/urdf/cinta_vasos.urdf y SEPARACION_CASILLA_VASOS_M
  # en sim/mundo.py.
  separacion_casilla_mm: 80
  # Lineas de medida de la camara de vasos (grupo, 2026-09-25: las 6
  # barreras IR se reemplazaron por vision). En la imagen de cada estacion
  # se miran dos franjas horizontales -- "barreras virtuales" -- a estas
  # fracciones de la altura del vaso. borde > 1.0 a proposito: la franja va
  # JUSTO POR ENCIMA del reborde, asi que un vaso normal NO la ocupa; solo
  # algo mas alto que un vaso (la condicion de "invalida" de la seccion 7).
  barrera_media_altura_frac: 0.5
  barrera_borde_altura_frac: 1.05
  # PROVISIONAL: ancho de la pestana del reborde de la boca del vaso
  # personalizado, en mm. Es lo que se apoya en los rieles de la canaleta y
  # de la cuna del carro (el cuerpo pasa entre los rieles, la pestana no).
  # Usuario (2026-09-26): 8 mm (antes 5). Con rieles a 69 mm la pestana
  # quedaba solo 1,5 mm mas alla del centro de cada riel: un vaso corrido
  # 1,5 mm se caia entre los rieles. Con 8 mm queda 4,5 mm mas alla. Boca
  # de 78 mm: con casillas de 80 mm quedan 2 mm entre bocas vecinas.
  reborde_mm: 8

motor_paso_a_paso:
  # PROVISIONAL: modelo del motor paso a paso de las cintas indexadas.
  # Confirmar antes de dimensionar el driver y el torque necesario.
  modelo: "NEMA17 17HS4401 (provisional)"
  pasos_por_revolucion: 200
  # 1/4 de micropaso (no 1/16): el firmware genera los pasos con el PWM del ESP32 y a 1/4
  # la frecuencia queda baja (~0,8 kHz la de monedas, ~0,9 kHz la de vasos, con el rodillo
  # de O22). La camara de cada cinta corrige el desfase igual.
  # (Antes: 16 aqui y 4 en firmware.micropasos_firmware; auditoria 2026-09-27: uno solo.)
  microstepping: 4

canaleta_entrega:
  # Inclinacion de los rieles de la canaleta, en grados (seccion 4).
  inclinacion_grados: 15

cortina_seguridad:
  # Usuario (2026-09-26): UN solo VL53L0X a media altura (el del medio de
  # los 3 que habia), que detenga la zona si ve una mano. No es un equipo de
  # seguridad certificado: lo que se busca es que el sistema se detenga. Si
  # alguien logra sacar un vaso sin cruzar el haz (por encima), lo ve la
  # camara de vasos, que revisa en cada tick que ninguna casilla haya
  # quedado sin su vaso.
  altura_mm: 65
  # El VL53L0X no es un rayo: mira en un CONO de unos 25 grados (dato de la
  # hoja de datos). A ~140 mm (largo de la zona) el cono ya mide ~31 mm de
  # radio. Con el eje a 85 mm del eje de la cinta, el cono queda a ~16 mm
  # del reborde de los vasos (39 mm de radio) en el punto mas abierto: aguanta
  # que el sensor quede torcido unos 6 grados sin ver los vasos. Por abajo
  # el cono llega a ~34 mm sobre la cinta y queda por fuera de su ancho.
  # El sensor va 20 mm pasado el eje de la prensa: mas alla estorbaria al
  # vaso que el empujador pasa a la canaleta.
  angulo_cono_grados: 25
  desplazamiento_lateral_mm: 85
  # PROVISIONAL: tiempo maximo desde que entra la mano hasta que la linea
  # sube la prensa y congela tapa y empujador. Confirmar con la velocidad real de la
  # leva de la prensa (una mano no deberia alcanzar a llegar debajo).
  reaccion_max_ms: 200

planta:
  # Decision de operacion, no medida fisica: tamano del LOTE. Cada tubo del
  # almacen (uno por denominacion) junta monedas hasta tener este numero y
  # entonces las suelta todas juntas en un vaso vacio: cada vaso lleva UNA
  # sola denominacion (regla del grupo). El enunciado no fija el numero.
  # Grupo (2026-09-22): 10 por defecto, pero depende de cuantas monedas
  # traiga el profesor ese dia: se cambia en caliente desde el dashboard
  # (orden "lote"), entre 1 y capacidad_tubo.
  monedas_por_vaso: 10
  # Grupo (2026-09-22): lo que queda en los tubos al terminar un turno se
  # puede empacar en vasos incompletos (boton "Embalar lo guardado") o se
  # queda guardado para el siguiente turno: si esto es true, al iniciar una
  # corrida nueva los tubos arrancan con lo que dejo la anterior (tabla
  # `almacen_turno` de SQLite, que no se borra entre corridas).
  conservar_almacen_entre_turnos: true
  # PROVISIONAL: cuantas monedas caben en cada tubo del almacen (depende
  # de la altura del tubo del CAD). Si un tubo se llena, la cinta de
  # monedas espera: una moneda aceptada nunca se descarta.
  capacidad_tubo: 25
  # Fotos por moneda en la estacion de vision (aprobado por el grupo: 2).
  # Se combinan con control.reglas.combinar_fotos.
  fotos_por_moneda: 2
  # Cada estacion lee su sensor esta cantidad de veces durante la pausa de
  # la cinta (cada lectura tarda 2-5 ms, la pausa 1000 ms) y decide por
  # mayoria: baja el error de una lectura suelta de p a ~3p^2.
  lecturas_por_decision: 3
  # Altura (mm) de la figura con la que el sabotaje "cambiar vaso"
  # reemplaza al vaso: por debajo de la franja de media altura (45 mm con
  # el vaso provisional de 90 mm), para que la re-verificacion la rechace.
  altura_figura_sabotaje_mm: 35

supervisor:
  # Base de datos SQLite que escribe el supervisor y lee el dashboard.
  ruta_bd: datos/planta.db
  # (El ritmo del supervisor ya no es un numero aparte: a velocidad 1 cada
  # tick dura lo mismo que un ciclo real de la cinta de monedas,
  # tiempos_ms.avance_casilla_monedas + pausa_casilla_monedas.)
  # Cada cuanto se revisa la tabla de ordenes cuando la linea esta quieta.
  intervalo_ordenes_s: 0.2
  # Puerto del servidor HTTP del supervisor: sirve el visor 3D y el estado
  # en vivo (/api/estado) y es el punto de entrada futuro de los dos ESP32.
  puerto_http: 8765

dashboard:
  # Cada cuanto se refrescan las pestanas en vivo, en s.
  refresco_s: 1.0

# ---------------------------------------------------------------------
# Canaleta de entrega, pista y vehiculo (seccion 4 y fase 6). Por ahora
# alimentan la geometria del visor 3D (sim/geometria.py); la simulacion del
# carro en PyBullet va a leer exactamente estos mismos valores.
# ---------------------------------------------------------------------

canaleta:
  # PROVISIONAL: largo horizontal de los rieles desde el final de la cinta
  # de vasos hasta la cuna del carro, en mm (la inclinacion esta arriba en
  # canaleta_entrega.inclinacion_grados).
  largo_mm: 280
  # PROVISIONAL: separacion entre los ejes de los dos rieles. El hueco entre
  # rieles (separacion - diametro del riel = 65 mm) tiene que dejar pasar el
  # cuerpo del vaso (62 mm) y la pestana del reborde (62 + 2x8 = 78 mm) tiene
  # que quedar apoyada encima. Antes era 56 mm: el cuerpo no cabia.
  separacion_rieles_mm: 69
  # PROVISIONAL: varilla lisa de acero (o tubo de aluminio) de cada riel,
  # FORRADA con cinta adhesiva de PTFE (teflon, ~0,13 mm) donde apoya la
  # pestana (usuario, 2026-09-26): plastico sobre metal roza casi lo mismo
  # que la pendiente de 15 grados (el vaso se quedaria quieto o avanzaria a
  # tirones); sobre PTFE el roce baja a ~0,1 y desliza parejo. Cinta y no
  # tubo: un tubo de 6 mm de diametro exterior dejaria 0,5 mm entre el cuerpo
  # del vaso y cada riel; la cinta no cambia las medidas.
  diametro_riel_mm: 4
  # Entrada en embudo (usuario, 2026-09-26): los rieles arrancan mas
  # separados y un poco mas abajo que la pestana, y se cierran a
  # `separacion_rieles_mm` en los primeros `largo_embudo_mm`. Un vaso que
  # llega corrido (hasta ~2 mm de lado) o un poco bajo (hasta
  # `caida_entrada_mm`) cae sobre los rieles en vez de chocar con su punta.
  # 73 mm: la pestana de 78 mm todavia queda 2,5 mm mas alla del centro de
  # cada riel en la boca del embudo.
  separacion_entrada_mm: 73
  largo_embudo_mm: 40
  caida_entrada_mm: 3
  # Cuantos vasos caben en fila contra el escape de dos dedos.
  capacidad_vasos: 4

pista:
  # PROVISIONAL: todo este bloque es un trazado propuesto, no medido. Forma
  # en S como la del enunciado (varias curvas, tres muros sobre la pista,
  # meta al final). Se describe como una lista de tramos para que el visor
  # y la simulacion generen exactamente la misma linea central.
  ancho_mm: 160
  ancho_linea_mm: 19          # cinta aislante negra estandar
  tramos:
    # Primera recta de 60 cm (2026-09-26, antes 30): a la vuelta el carro da
    # media vuelta en la marca de giro y se endereza siguiendo la linea antes
    # de entrar de reversa al muelle; con 30 cm eso pasaba sobre la curva.
    - {tipo: recta, largo_mm: 600}
    - {tipo: curva, radio_mm: 300, angulo_grados: 180}    # positivo = izquierda
    # Rectas con muro de 90 cm (antes 60) y el muro en el medio: la maniobra
    # de evasion ocupa ~30 cm antes del muro y ~35 cm despues hasta que el
    # carro vuelve a la linea. Con 60 cm volvia justo donde empieza la curva
    # y, con errores de motor, la perdia (visto en la simulacion). Si la pista
    # real que entregue el profesor tiene los muros mas cerca de una curva,
    # este es el dato a revisar.
    - {tipo: recta, largo_mm: 900}
    - {tipo: curva, radio_mm: 300, angulo_grados: -180}
    - {tipo: recta, largo_mm: 900}
    - {tipo: curva, radio_mm: 300, angulo_grados: 180}
    # La ultima, mas larga: la meta queda 65 cm despues del tercer muro.
    - {tipo: recta, largo_mm: 1100}
  # Posicion de cada muro sobre la linea, como distancia recorrida desde la
  # salida (mm): en el medio de cada recta de 90 cm (y a 45 cm del inicio de
  # la ultima).
  obstaculos_mm: [1992, 3834, 5676]
  obstaculo_largo_mm: 100
  obstaculo_alto_mm: 80
  obstaculo_grueso_mm: 30     # a lo largo de la pista (el visor lo dibuja igual)

vehiculo:
  # PROVISIONAL: dimensiones de un chasis tipico de 2 ruedas + rueda loca.
  largo_mm: 180
  ancho_mm: 120
  alto_mm: 55
  diametro_rueda_mm: 65
  # Ancho de la llanta de la rueda TT (la amarilla de 65 mm del kit): ~26 mm medidos en la
  # rueda real. Lo leen la fisica (sim/vehiculo_sim.py, el cilindro de cada rueda) y el visor
  # (crearRuedaTT, via sim/geometria.py) para que no vuelvan a divergir (pedido 13a,
  # 2026-09-28: PyBullet tenia 22 mm y el visor 26).
  ancho_rueda_mm: 26
  # Banda de rodadura: la parte de la llanta que apoya en el piso (al centro); a cada lado queda un
  # hombro redondeado de (26 - 20) / 2 = 3 mm. En la fisica los hombros son 1,5 mm mas chicos de
  # radio: asi la llanta apoya en su banda, como la goma real, y no salta de un borde al otro como
  # un cilindro plano (eso corria la odometria: ver sim/vehiculo_sim.py, _crear_carro).
  rodadura_rueda_mm: 20
  # Arreglo de 5 infrarrojos de linea (TCRT5000 o similar), bajo el frente.
  sensores_linea: 5
  separacion_sensores_linea_mm: 15
  # Ultrasonico frontal (HC-SR04): rango util y distancia a la que se
  # considera que hay un obstaculo y hay que empezar la evasion.
  ultrasonico_rango_min_mm: 20
  ultrasonico_rango_max_mm: 4000
  # El HC-SR04 ve lejos (4 m) pero mide LENTO: ~60 ms entre disparos (si no,
  # se mezclan los ecos). Queda de RESPALDO (usuario, 2026-09-26): no le
  # afectan las superficies negras o brillantes ni el sol, que si confunden
  # al laser.
  ultrasonico_periodo_ms: 60
  # Sensor principal adelante: laser de tiempo de vuelo VL53L0X (el mismo
  # modelo de la cortina y del interior del vaso, en el mismo bus I2C del
  # ESP32 del carro): una medicion cada 33 ms, hasta ~1,2 m, cono de ~25 grados.
  tof_periodo_ms: 33
  tof_rango_max_mm: 1200
  # Con algo a menos de `distancia_frenado_mm` (cualquiera de los dos
  # sensores) el carro baja a velocidad de maniobra; a menos de
  # `distancia_obstaculo_mm` en 3 mediciones seguidas del laser (o 2 del
  # ultrasonico) se detiene y esquiva. Asi puede ir rapido en las rectas sin
  # llegar rapido al muro.
  distancia_frenado_mm: 500
  distancia_obstaculo_mm: 200
  # --- Punto 14 (usuario, 2026-09-26): movimiento, estabilidad y evasion ---
  # 2 ruedas motrices + rueda loca (bola): tres apoyos SIEMPRE tocan el piso
  # (un plano pasa por 3 puntos), gira sobre su propio eje sin patinar y los
  # encoders cuentan lo que de verdad avanzo. Con 4 ruedas rigidas, en un piso
  # desparejo una rueda motriz queda en el aire y el encoder cuenta de mas; y
  # al girar sobre su eje las 4 patinan (giro por derrape).
  masa_kg: 0.60                      # PROVISIONAL: chasis + bateria + electronica
  # Rodillos guia (rodamiento 623) en las esquinas traseras, un poco mas
  # afuera que las llantas: las guias del muelle empujan ESTOS (5 cm detras
  # del eje) y el carro gira hacia el centro al entrar de reversa. Son la
  # parte mas ancha del carro: la evasion cuenta con ellos.
  # 88 (pedido 13a, 2026-09-28; antes 86): con la llanta real de 26 mm su cara de afuera queda a
  # 60 + 13 + 13 = 86 mm del centro (con la de 22 quedaba a 84). Los rodillos (y con ellos las
  # guias del muelle, que se ubican desde el rodillo) se corren 2 mm por lado para mantener los
  # 7 mm entre llanta y rodillo del diseno: en 56 viajes simulados (44 semillas + 11 con el doble
  # de error + sin error) la llanta paso a >= 5,6 mm de la guia (sin correrlos, 3,7 mm; con la
  # llanta de 22, 6,5 mm), 0 reintentos, y 55 de 56 sin tocar un muro (antes 53 de 56).
  rodillo_guia_y_mm: 88             # 88 + 5 de radio = 93 mm: 7 mm mas afuera que las llantas (86)
  rodillo_guia_radio_mm: 5
  # Vaso lleno, peor caso RAZONABLE (usuario 2026-09-28: "el valor del vaso mas logico"):
  # vaso 25 g + tapa 8 g + un lote de 10 monedas de la mas pesada ($1000 nueva, 10 g) =
  # 133 g (la misma suma que config/masas.yaml -> docs/peso.md; una prueba las compara).
  # Antes 0,10 kg ("aprox."), que no sumaba ni el vaso ni la tapa. PROVISIONAL: pesar.
  masa_vaso_lleno_kg: 0.133
  # Encoders: disco ranurado de 20 ranuras en el eje de la rueda (kit comun).
  # PROVISIONAL: 1 pulso = 2*pi*32,5/20 ~ 10 mm; la simulacion cuenta con esa
  # resolucion, no con el angulo exacto de la rueda.
  encoder_pulsos_por_vuelta: 20
  # El vaso va tomado en 4 puntos a media altura (espuma adelante, lengueta
  # atras, dos guias a los costados; usuario 2026-09-26) ademas de colgar de
  # los rieles: no cabecea, asi que el carro puede ir mas rapido. La
  # aceleracion sigue limitada (rampa) para no patinar ni golpear el vaso.
  velocidad_linea_m_s: 0.40
  velocidad_maniobra_m_s: 0.12
  velocidad_giro_rueda_m_s: 0.10     # cada rueda al girar sobre el eje
  aceleracion_max_m_s2: 1.0
  control_hz: 50
  # Obstaculo: distancia < distancia_obstaculo_mm en N lecturas SEGUIDAS (un
  # pie o una mano que pasa no dispara la maniobra).
  lecturas_obstaculo: 3
  # Antes de esquivar, el carro gira sobre su eje +-30 grados y mide con el
  # mismo ultrasonico: esquiva hacia el lado con mas espacio. Empate (los dos
  # lados libres mas alla de `distancia_libre_mm`): por la izquierda, siempre
  # igual (repetible).
  angulo_mirar_grados: 30
  distancia_libre_mm: 500
  # Maniobra: sale a 45 grados hasta quedar `margen_evasion_mm` afuera del
  # muro, pasa derecho, vuelve a 45 grados hacia la linea y la reengancha con
  # los infrarrojos (no depende de haber contado bien los pulsos).
  margen_evasion_mm: 30
  # PROVISIONAL (2026-09-27): cuanto mas pasa el muro antes de volver en
  # diagonal a la linea. Con ruedas que patinan, el carro llega a ese punto
  # con varios grados de error y con 30 mm la esquina de atras llego a rozar
  # el extremo del muro (1 de 11 semillas). No cambia cuanto se sale de lado.
  margen_pasar_muro_mm: 70
  # Vuelve a la linea en diagonal a este angulo (60: la maniobra ocupa menos
  # pista despues del muro que a 45).
  angulo_regreso_grados: 60
  # Marca de giro (franja negra transversal) antes del muelle: a la vuelta el
  # carro se detiene ahi, gira 180 grados sobre su eje y entra de reversa.
  marca_giro_mm: 170                 # distancia desde la salida (centro del carro en el muelle)
  franja_giro_ancho_mm: 20
  franja_meta_ancho_mm: 50           # la meta tambien es una franja negra (se ve con los 5 infrarrojos)
  # En la meta el operador saca el vaso (se levanta: cuelga de los rieles);
  # el infrarrojo de la cuna ve que ya no esta y el carro vuelve solo.
  espera_descarga_meta_s: 4
  espera_meta_sin_enlace_s: 20      # sin radio, en la meta espera como mucho esto y vuelve (con el vaso si no se lo sacaron)
  # Si una orden lo deja `atascado` (una rueda cuenta mucho mas que la otra), frena y se aparta
  # esto por donde vino, para no quedar apretado contra lo que lo trabo (usuario, 2026-09-27).
  apartarse_atascado_mm: 50
  # Reversa al muelle con tiempo limite (2026-09-27: se vio 35 s trabado en la boca avanzando de a
  # milimetros). PROVISIONALES: una reversa normal tarda ~11 s. Si pasa `reversa_tope_max_s`, o
  # avanza menos de `reversa_tope_avance_min_mm` en `reversa_tope_sin_avance_s` sin estar a fondo,
  # sale derecho `reversa_tope_salida_mm` hacia adelante y reintenta UNA vez; si vuelve a fallar se
  # detiene con el error `no_llego_al_tope`.
  reversa_tope_max_s: 15
  reversa_tope_sin_avance_s: 3
  reversa_tope_avance_min_mm: 20
  reversa_tope_salida_mm: 150
  # En el reintento va con el PWM normal hasta pasar esto mas alla de donde se trabo (con el bajo
  # no alcanza a correr el rodillo por la guia en V; en la simulacion, seeds 2 y 3, se trababa otra
  # vez en el mismo punto) y vuelve al bajo antes del tope, donde el motor se tiene que ahogar.
  reversa_tope_pwm_normal_mm: 50
  # Boca del muelle: cuanto avanza el carro desde el tope hasta que su cola queda en la boca de las
  # guias en V (rectas hasta pasar las ruedas + 20 cm de V; mismas medidas que sim/vehiculo_sim.py,
  # lo revisa tests/control/test_vehiculo.py). De ahi hacia adentro la reversa NO corrige el rumbo con los
  # pulsos: la centra la guia (2026-09-27: corrigiendo adentro de la V se trababa torcido).
  # El margen cubre el error de la odometria (se pone en su lugar en la marca de giro). PROVISIONAL.
  # Guias del muelle (antes constantes en sim/vehiculo_sim.py; ahora aqui para que la fisica, el
  # visor y el mapa del carro lean lo mismo): largo de la boca en V, cuanto se abre por lado en ese
  # largo y la holgura por lado entre el rodillo guia y la guia recta.
  muelle_largo_boca_mm: 200
  muelle_abre_boca_mm: 45
  muelle_holgura_mm: 3
  boca_muelle_mm: 305
  boca_muelle_margen_mm: 30

# Donde PUEDE andar el carro por orden (usuario, 2026-09-27: el asistente lo mando "a donde esta
# el filtro de monedas" y se trabo contra el muelle). El laser (7,4 cm del piso) y el ultrasonico
# (5,7 cm) no ven lo bajo -- las guias del muelle miden 2 cm y sus topes 4,5 -- y la planta no esta
# en la pista. sim/geometria.py (`zonas_carro`) arma con esto y con la geometria de siempre un
# rectangulo de piso libre y las huellas prohibidas (planta, canaleta, muelle, poste de la camara);
# el carro (control/vehiculo.py) rechaza un destino o un camino recto que las toque.
zonas_carro:
  # PROVISIONAL: cuanto sobresale la estructura de la planta (patas de las mesas, portico,
  # cubetas, postes de las camaras) mas alla de los puntos conocidos (estaciones de las dos
  # cintas, almacen y bandejas). Medir en el montaje. 150 (revision de solapes, 2026-09-27): en el
  # visor el NEMA17 de la cinta de vasos llega a y = -218 mm (12 cm mas alla de las estaciones,
  # con 100 quedaba 1,8 cm fuera) y el gabinete de control a y = +268 mm (14 cm detras del rechazo).
  margen_planta_mm: 150
  # PROVISIONAL: soportes de la canaleta a cada lado de su eje (el visor: 28 mm afuera de cada
  # riel + el perfil 2020; el poste del escape llega a 90 mm del eje, 2026-09-27) + 10 mm de margen.
  medio_ancho_canaleta_mm: 100
  # PROVISIONAL: poste de la camara de vasos, que llega al piso al lado de la cinta (pie de
  # 3 cm, 2 cm detras de la camara): cuadrado de este medio lado alrededor de la camara.
  medio_lado_poste_camara_mm: 40
  # PROVISIONAL: piso libre alrededor de la pista (desde el borde de la pista) por el que el carro
  # puede andar por orden. Depende del salon: medirlo el dia de la sustentacion.
  margen_zona_libre_mm: 300

# Puesto del PC en el piso, al costado de la planta (2026-09-28): el portatil (ASUS TUF A15 de
# 359 x 256 mm, dibujado x1,5 en el visor para leer la pantalla) y el hub USB (100 x 35 mm). Los usa
# el visor para dibujarlos y el mapa del carro (`zonas_carro`) para no mandarlo encima de ellos.
# Medidas del DIBUJO (la huella real del portatil es mas chica: el mapa queda del lado seguro).
puesto_pc:
  laptop_centro_mm: [0, 535]
  laptop_tamano_mm: [539, 384]       # ancho (x) y fondo (y), ya x1,5
  hub_centro_mm: [360, 330]
  hub_tamano_mm: [100, 35]
  margen_mm: 30                      # holgura del carro alrededor (cables al piso incluidos)

# ---------------------------------------------------------------------
# REPLICACION EN LA VIDA REAL (docs/replicacion.md se genera de aqui).
# Todo este bloque es PROVISIONAL: sale de hojas de datos y de valores
# tipicos, NO de mediciones del montaje. Cada valor se reemplaza por lo que
# se mida en banco (el procedimiento esta en docs/replicacion.md).
# ---------------------------------------------------------------------

# Protocolo (punto 15): mensajes numerados y confirmados, latido y reglas del
# enlace. Logica en control/protocolo.py; contrato en docs/especificacion.md, 10.1.
protocolo:
  pc_reintento_ms: 300          # PC -> ESP32 fijo: sin ack, un reintento y despues fallo
  pc_reintentos: 1
  pc_latido_ms: 500             # latido PC <-> ESP32 fijo (los dos sentidos)
  pc_sin_latido_ms: 2000        # el ESP32 fijo sin el PC: parada segura
  carro_latido_ms: 250          # latido carro <-> ESP32 fijo (ESP-NOW)
  carro_enlace_perdido_ms: 1000 # sin oir nada en este tiempo: enlace perdido
  carro_reintento_ms: 500       # el carro reenvia lo que no tiene ack (sin limite)
  carro_cola_max: 32            # eventos guardados como maximo mientras no hay enlace
  # Ordenes del PC al carro (2026-09-29): el fijo las reenvia por ESP-NOW cada
  # carro_reintento_ms hasta oir la respuesta_orden del carro, como mucho estas
  # veces; si no llega, avisa carro_sin_respuesta (antes salian UNA vez y, si se
  # perdia el paquete, la orden desaparecia sin aviso).
  carro_orden_intentos: 4

tiempos_ms:
  # Tiempos LENTOS a proposito (pedido del grupo, 2026-09-22): el montaje
  # real necesita verificar con calma. La simulacion corre con ESTOS mismos
  # tiempos (supervisor a velocidad 1 y ventana de PyBullet), asi que lo que
  # se ve es lo que va a pasar. El detalle de los motores de las cintas
  # (pasos, micropasos, rampas) va en su seccion mas adelante.
  # Cinta de monedas: 40 mm por avance.
  avance_casilla_monedas: 600         # ~70 mm/s con rampas suaves
  pausa_casilla_monedas: 1000         # todo lo que se verifica en la casilla pasa aqui (lecturas votadas, vision y serial)
  presencia_lectura: 2                # FC-51 (infrarrojo + comparador): respuesta < 1 ms
  material_lectura: 5                 # LJC18A3 / LJ18A3: conmutan a 100-500 Hz
  intervalo_entre_lecturas: 30        # separa las lecturas repetidas (antirrebote, que sean independientes)
  vision_captura_inferencia: 400      # foto + segmentacion + clasificador, con holgura para el portatil
  desvio: 150                         # compuerta de desvio de la descarga (SG90, ~30 grados)
  # Carrusel del almacen: hasta 180 grados (el camino mas corto entre dos tubos, o hasta el
  # agujero). Es el tiempo REAL del firmware: 2048 medios pasos x firmware.carrusel_ms_por_paso
  # (2 ms) = 4096 ms (un tubo vecino, 60 grados: 1365 ms). Antes decia 500 ms, que el 28BYJ-48
  # no puede (~15 rpm como mucho = 2 s por media vuelta). Con esto NO caben dos chequeos de
  # control/tiempos.py: lo que se ajusta es que la cinta de monedas ESPERA al carrusel en esos
  # ciclos (docs/replicacion.md). Una prueba exige que este numero siga al firmware.
  carrusel_giro: 4096
  compuerta_tubo: 600                 # abrir el obturador, caer el lote, cerrar
  # Caida de una moneda aceptada desde el borde de la cinta hasta quedar quieta en su tubo
  # (embudo de la descarga -> compuerta de desvio -> canal corto a ~72 grados -> boca -> fondo).
  # Mientras cae, el carrusel NO puede girar: el siguiente giro sale recien cuando termina
  # (revision visual 2026-09-29: el giro a la siguiente moneda arrancaba en el mismo instante y
  # la moneda caia 15-37 mm fuera de la boca). PROVISIONAL, de la geometria (sim/mundo.py):
  # 180 mm de altura de la cinta (z 452 mm) al fondo de un tubo vacio (z 272 mm); caida libre
  # sqrt(2h/g) = 0,19 s; por tramos (26 mm de embudo en caida libre, 0,08 s; la moneda casi se
  # frena en la compuerta y resbala 74 mm por compuerta+canal con roce 0,3, 0,13 s; 74 mm mas
  # hasta el fondo, 0,06 s) = 0,27 s, + ~0,1 s de rebote hasta quedar plana = 0,37 s ->
  # redondeado arriba a 400 ms. COMO SE MIDE: video en camara lenta (240 fps) de 10 monedas de
  # cada tamano, desde que dejan la cinta hasta que la pila deja de moverse; usar el peor caso
  # (tubo vacio). Una prueba exige que sea >= la caida libre y menor que la pausa.
  caida_moneda_tubo: 400
  # Cinta de vasos: 80 mm por avance, mas carga.
  avance_casilla_vasos: 1000
  # 1400 ms (grupo, 2026-09-29; antes 800): caben los DOS intentos de tapa del peor caso (2 x (tapa_caida +
  # 3 cuadros) = 1360 ms). No afecta al almacén: los vasos piden un lote cada `monedas_por_vaso` monedas,
  # mucho más lento que un ciclo de vasos, así que el carrusel nunca se satura por esta pausa.
  pausa_casilla_vasos: 1400
  camara_vasos_cuadro: 60             # un cuadro de la webcam (30 fps) + silueta + ArUco en el PC
  tapa_caida: 500                     # caida de la tapa por gravedad desde el tubo
  prensa_ciclo: 1400                  # servo MG996R con la leva: 0 -> 180 -> 0 grados (~0,6 s por lado con carga)
  empujador: 700
  cortina_lectura: 33                 # VL53L0X (seguridad: esta NO se hace lenta)
  # Comunicaciones.
  serial_ida_vuelta: 20               # 115200 baud: ~80 bytes por linea = ~7 ms por sentido + parseo
  # (esp_now_latencia se quito el 2026-09-28: no la leia nadie. Ningun paso de la
  # linea espera a la radio del carro dentro de una pausa; los plazos de la radio
  # son los de `protocolo` (latido 250 ms, enlace perdido 1 s, reintento 500 ms),
  # que ya son mucho mas largos que su latencia tipica de < 5-10 ms.)

errores_sensores:
  # Probabilidad por lectura (0.005 = 0,5 %) y ruido de medida. En las
  # pruebas automaticas se apagan (resultado exacto); el supervisor y la
  # demo los usan para ver como reacciona la linea a errores reales.
  presencia:  {falso_negativo: 0.005, falso_positivo: 0.001}    # piezas muy oscuras o brillantes, luz ambiente
  capacitivo: {falso_negativo: 0.002, falso_positivo: 0.001}    # humedad, polvo sobre la cara del sensor
  inductivo:  {falso_negativo: 0.01,  falso_positivo: 0.0}      # metales poco ferrosos (bronce, cuproniquel) a 4 mm
  cortina:    {falso_negativo: 0.001, falso_positivo: 0.002}    # VL53L0X: ruido ±3 % a corta distancia
  # Sensor del interior del vaso (VL53L0X): falso negativo = no ve un objeto
  # chico adentro; falso positivo = ve algo en un vaso vacio (reflejo).
  sensor_interior: {falso_negativo: 0.005, falso_positivo: 0.002}
  # Infrarrojo de la cuna del carro (punto 13): falso negativo = no ve el
  # vaso que si llego (se reintenta la lectura; si sigue sin verlo, alarma).
  cuna: {falso_negativo: 0.005, falso_positivo: 0.002}
  # Carro (punto 14): cada motor gira un poco distinto al otro con el mismo
  # PWM (en la simulacion, hasta este +- porcentaje, fijo por corrida);
  # ruido del ultrasonico; lectura cambiada de un infrarrojo de linea.
  carro: {diferencia_motores: 0.05, ruido_ultrasonico_mm: 5, ruido_tof: 0.03, error_linea: 0.01}
  # Posicion de cada cinta medida por su camara (reemplaza al sensor de
  # ranura): falso_negativo = no ve bien el separador y cree que la cinta se
  # corrio (se re-sincroniza de gusto); falso_positivo = no nota un desfase.
  posicion_camara: {falso_negativo: 0.001, falso_positivo: 0.0005}
  # Camara de vasos con panel de luz detras (silueta a contraluz): no_lee es
  # el marcador ArUco (reflejo, tapado, fuera de foco); falso_* es la silueta
  # de UNA franja de medida en UN cuadro (sombra, reflejo en el vaso);
  # no_ve_tapa es no ver la tapa naranja sobre la boca en un cuadro.
  # (error_fondo se quito el 2026-09-28: no lo leia nadie. Era el error de ver
  # monedas en el fondo de un vaso vacio o no verlas en uno lleno, para la
  # confirmacion del lote (`lote_no_confirmado`, paso 10), que la simulacion todavia
  # NO modela: cuando se modele, vuelve aqui y lo aplica control/hal/backend_sim.py.)
  camara_vasos: {no_lee: 0.02, no_ve_tapa: 0.005, falso_negativo: 0.002, falso_positivo: 0.001}
  camara:
    ruido_diametro_mm: 0.08           # calibracion de escala + borde difuso (1 px ~ 0,1 mm)
    ruido_circularidad: 0.01
    probabilidad_error_clase: 0.02    # por foto: no reconoce la cara (reflejo, sombra); matriz de confusion en la fase 5
    probabilidad_confusion_clase: 0.005  # por foto: la reconoce como OTRA clase colombiana

errores_actuadores:
  # PROVISIONAL: probabilidad por avance de que la cinta patine o alguien la
  # frene (la marca de referencia no llega a tiempo); se re-sincroniza.
  cinta: {desfase: 0.002}

simulacion:
  # Carro: "fisico" = el carro con fisica real (sim/vehiculo_sim.py, punto
  # 14): sale del muelle, esquiva, llega a la meta y vuelve solo.
  # "reemplazo" = uno que se lleva el primer vaso de la canaleta cada
  # `carro_retira_cada_ticks` ticks (lo usan las pruebas de la planta: mas
  # rapido).
  carro: fisico
  carro_retira_cada_ticks: 6
  # Usar los errores de arriba en el supervisor (dashboard y visor). Semilla
  # fija: la misma corrida da el mismo resultado, para poder mostrarla.
  errores_sensores: true
  semilla: 7

# Fase 8 (2026-09-27): valores del FIRMWARE de los dos ESP32. firmware/preparar.py
# los copia a `config_placa.py` de cada placa (fuente unica: no se escriben a
# mano en el firmware). Todo PROVISIONAL hasta medirlo en el montaje.
firmware:
  # Cintas: NEMA17 + A4988 directo al rodillo motriz (acople flexible). El rodillo
  # es el del modelo 3D: tubo de aluminio de O22 mm (app/visor3d/piezas/linea_monedas.js,
  # crearRodilloCinta; el visor lo gira 1 rad por cada 11 mm de banda). Las DOS cintas
  # usan el mismo rodillo. Banda por vuelta = pi x 22 = 69,1 mm (antes 40, que suponia
  # un rodillo de O12,7 que no existe en el diseno; usuario 2026-09-28: "igual al del 3D").
  # Con 200 pasos x 1/4 de micropaso = 800 micropasos por vuelta:
  #   11,57 micropasos por mm -> casilla de monedas (40 mm) = 463 micropasos (0,58 vueltas),
  #   casilla de vasos (80 mm) = 926 micropasos (1,16 vueltas); 0,086 mm por micropaso.
  # La casilla ya no es un numero entero de vueltas: no importa, el firmware manda
  # pasos (no vueltas) y la camara de cada cinta corrige lo que sobre o falte.
  # Ojo al medir: la banda (~2 mm) tira un poco por su linea media (O24 -> ~75 mm por
  # vuelta). Se deja pi x O del rodillo, como el 3D; si al marcar la banda y dar 10
  # vueltas mide otra cosa, se cambia SOLO este numero. PROVISIONAL.
  mm_por_vuelta_cinta: 69.1
  # El micropaso y los pasos por vuelta del NEMA17 estan en motor_paso_a_paso.
  # A4988: ENABLE (G13, compartido por los dos drivers) se apaga cuando las DOS cintas
  # llevan este tiempo quietas. Es mas largo que las pausas normales (1000 ms monedas,
  # 1400 ms vasos), asi que con la linea andando los motores NUNCA se sueltan entre dos
  # casillas: solo en las esperas largas (linea en pausa, parada segura, sin piezas).
  # Ver el porque en firmware/fijo/hw.py (Hardware._revisar_enable).
  a4988_reposo_ms: 3000
  # Perro guardian (machine.WDT) del ESP32 del carro: si el bucle de control se
  # traba mas de este tiempo, la placa se reinicia sola (y al arrancar los motores
  # quedan en 0). El ciclo normal es de 20 ms; 2 s deja margen de sobra para las
  # lecturas lentas (ultrasonico ~30 ms, VL53L0X). 0 = sin perro (para depurar con
  # Thonny: con el WDT activo, detener main.py reinicia la placa a los 2 s).
  carro_wdt_ms: 2000
  # Carrusel: 28BYJ-48 en medio paso = 4096 pasos por vuelta (con engranaje).
  # 2 ms por medio paso = 500 Hz: por debajo de los 600 Hz de arranque sin perder pasos
  # de su hoja de datos ("idle in-traction frequency > 600 Hz", en vacio a 5 V). Mas
  # rapido (1 ms = 1000 Hz, su limite en vacio) no deja margen para la inercia de los
  # tubos con monedas. Con 2 ms: un tubo (60 grados) = 1,37 s y media vuelta = 4,1 s
  # (tiempos_ms.carrusel_giro sale de aqui). Los pasos los da un Timer por hardware, no
  # el bucle principal, para que esos tiempos sean los reales.
  carrusel_pasos_por_vuelta: 4096
  carrusel_ms_por_paso: 2
  # Bus I2C largo (I2C 1, SoftI2C en G16/G17: VL53L0X del interior y de la cortina,
  # cables hasta la cinta de vasos, ~170 pF con pull-ups de 2,2 kOhm). A 100 kHz la
  # subida (~317 ns) cumple la norma (1000 ns); a 400 kHz (300 ns) NO. El bus corto I2C 0 (PCA9685,
  # cable corto dentro de la caja) sigue a 400 kHz. docs/revision-final.md, docs/electrica.md.
  i2c_bus_largo_hz: 100000
  # Servos por el PCA9685 (canal = el del conexionado). Angulos PROVISIONALES:
  # reposo = posicion segura (la que toma en la parada segura).
  servos:
    desvio:    {canal: 0, reposo: 0,   activo: 30}     # 0 = al rechazo (a prueba de fallas)
    obturador: {canal: 1, reposo: 0,   activo: 90}
    tapas:     {canal: 2, reposo: 0,   activo: 60}
    prensa:    {canal: 3, reposo: 0,   activo: 180}    # 0 = arriba
    empujador: {canal: 4, reposo: 0,   activo: 120}
    canaleta:  {canal: 5, reposo: 0,   activo: 45}     # escape de dos dedos: 0 = retener
  # Cortina: el umbral (por debajo de esa distancia el VL53L0X ve una mano) YA NO
  # se escribe aqui: es el largo de la zona que vigila, el MISMO que usa la
  # simulacion para el alcance de su cono (sim/sensores_sim.ventana_cortina_mm:
  # desde media casilla antes de la tapa hasta el sensor, 20 mm pasado la prensa =
  # 140 mm hoy). firmware/preparar.py lo pasa a la placa. Antes eran dos numeros
  # distintos (150 aqui, 140 en la simulacion) que un comentario decia iguales.
  # Sin mano el sensor lee la pared de enfrente (mas lejos) o nada.
  #
  # Cortina sin lecturas nuevas: el VL53L0X mide cada ~33 ms. Si pasa este tiempo
  # sin una medicion nueva (cable I2C flojo, sensor colgado), la ultima distancia
  # es vieja y la placa pone la cortina ACTIVA (evento cortina_sin_lectura): falla
  # del lado seguro. ~4 mediciones perdidas seguidas. PROVISIONAL.
  cortina_sin_lectura_ms: 150
  # Perro guardian (machine.WDT) del ESP32 FIJO, como carro_wdt_ms: si el bucle se
  # traba mas de esto, la placa se reinicia y arranca en parada segura. La vuelta
  # normal es de ~2-5 ms (el avance de una cinta espera 5 ms la primera vez).
  # 0 = sin perro (para depurar con Thonny).
  fijo_wdt_ms: 2000
  # Una excepcion que se repite en CADA vuelta del bucle (sensor muerto) mandaba
  # un evento + traceback cada ~2 ms (~500 lineas/s al USB y a SQLite). Ahora se
  # avisa la primera vez y despues como mucho una vez cada esto, con cuantas se
  # callaron (`repetidos`). La parada segura se sigue aplicando en cada vuelta.
  aviso_error_cada_ms: 1000
  # Polaridad de los modulos (True = la salida baja a 0 cuando detecta).
  activo_bajo: {presencia: true, capacitivo: true, inductivo: true, hall: true, cuna: true, linea_negro_alto: true}
  telemetria_ms: 200
  # Carro: velocidad de rueda con el PWM al 100 % (sin carga), para el control
  # de velocidad (adelanto + correccion con los encoders). PROVISIONAL.
  carro_v_max_m_s: 0.55
  carro_ganancia_ki: 0.8
  # Tope del PWM de los motores TT (de 3-6 V) con la bateria 2S (7,4 V, hasta 8,4 V
  # llena): 0,70 x 8,4 V = 5,9 V medios, nunca pasa de los 6 V del motor. Trabado, un
  # motor pide ~1,07 A (dentro de los 1,2 A continuos del TB6612) en vez de 1,53 A al
  # 100 %, y los dos juntos no llegan a los 3 A del fusible. Lo aplica firmware/carro/hw.py
  # DESPUES de la correccion integral (que antes podia llevarlo al 100 %).
  # Consecuencia honesta: con la bateria a 7,4 V el carro llega a ~0,70 x 0,55 = 0,39 m/s,
  # un poco menos que vehiculo.velocidad_linea_m_s (0,40): el control con encoders
  # simplemente va ~4 % mas lento en la linea; con la bateria llena sobra.
  carro_pwm_max: 0.70

# Fase 8: ESTA es la linea que cambia la simulacion por el hardware real.
#   sim  -> PyBullet (lo de siempre)
#   real -> los dos ESP32 por el USB serial (app/puente_serial.py). Sin placa
#           conectada usa la estacion EMULADA (mismo firmware, hardware falso).
# Con `real`, hoy: monitoreo en vivo, parada/reanudar, prueba de cada actuador
# y ordenes al carro. La linea automatica completa necesita la vision real
# (fase 5: faltan las fotos de las monedas para entrenar).
hardware:
  backend: sim
  puerto: auto          # o "COM5"
