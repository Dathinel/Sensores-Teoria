# Precios en Colombia de todo el proyecto (usuario, 2026-09-27: "eso sí o sí se lo preguntarán").
#
# Fuente única: app/documentos.py genera docs/costos.md, el dashboard (pestaña "Montaje real") y
# el asistente leen de aquí. Cada `id` es el de sim/catalogos.py (COMPONENTES o
# CATALOGO_SENSORES); `extras` son materiales que no están en el catálogo pero hay que comprar.
#
# `fuente`: "tienda" = precio publicado en esa tienda el día de la consulta; "estimado" = no hay
# un producto igual publicado (se estimó con productos parecidos: VERIFICAR antes de comprar).
# Los precios cambian: todo es del 2026-09-27, en pesos colombianos (COP), sin envío.

