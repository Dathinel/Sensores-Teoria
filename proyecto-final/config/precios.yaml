# ======================================================================================
# Estructura 3D: piezas impresas, perfilería y tornillería CONTADAS (usuario, 2026-09-28:
# "costos en estructura 3D completos, en tablas y todo"). Antes el PLA era "2 kg estimados" y el
# perfil "3 m estimados"; ahora cada cosa sale del modelo 3D del visor (app/visor3d):
#   - medidas_mm: la caja que ocupa la pieza en el modelo (redondeada al mm);
#   - volumen_cm3: el volumen de MATERIAL de la pieza (lo que el laminador llama "volumen del
#     modelo"). origen "malla" = medido sumando los tetraedros de la malla del visor (visor con
#     ?auditar&sinoptimizar, 2026-09-28); "estimado" = la malla no es cerrada o incluye otras
#     cosas, y se calculó a mano con superficie x espesor de pared (se dice cómo en `como`).
#   - maciza: true = paredes de 3 mm o menos: con 3 perímetros de 0,45 mm la pieza sale llena
#     (el relleno no aplica); false = pieza gruesa, lleva cáscara + relleno.
# app/costos.py calcula gramos, horas y costo de cada una; app/masas.py reusa esos gramos.
estructura_3d:
  consultado: "2026-09-28"
  impresion:
    # Gramos de una pieza:  g = V x densidad x f x (1 + desperdicio)
    #   f = 1                                   si la pieza es maciza (pared <= 3 mm)
    #   f = paredes + (1 - paredes) x relleno   si no: la cáscara (perímetros + pisos y techos)
    #       sale sólida y el interior lleva el `relleno`. `paredes` = fracción del volumen que ocupa
    #       la cáscara en una pieza mediana de este proyecto (20-60 mm de lado): ~0,40.
    densidad_g_cm3: 1.24          # PLA (hoja de datos de cualquier marca: 1,24-1,25)
    relleno: 0.20                 # 20 %, el de fábrica en Cura/PrusaSlicer
    paredes: 0.40                 # estimado (ver arriba)
    desperdicio: 0.10             # purga, falda, soportes y alguna impresión fallida: estimado
    gramos_por_hora: 10           # impresora tipo Ender 3, boquilla 0,4, capa 0,2, ~50 mm/s: estimado
    kwh_por_hora: 0.12            # consumo medio de una Ender 3 con cama caliente a 60 °C: estimado
    tarifa_kwh: 800               # COP/kWh, estrato 3-4 en Colombia 2026: ESTIMADO (ver el recibo)
    precio_kg: 93900              # filamento PLA 1,75 mm, 1 kg
    tienda: electronilab
    fuente_precio: tienda
    # Costo de una pieza = gramos x precio_kg / 1000  +  horas x kwh_por_hora x tarifa_kwh,
    # con horas = gramos / gramos_por_hora.

  # subsistema: el de costos (los mismos de `items`). zona: el de docs/peso.md (si falta, es el
  # subsistema). componente: id del catálogo al que pertenece (su fila de costos suma estas
  # piezas); sin componente (o si su componente se compra aparte, como los tubos del almacén), la pieza va a
  # la fila "Otras piezas impresas" de su subsistema.
  # tornillos: lo que sujeta UNA pieza (tipos en `tornilleria.tipos`).
  piezas_impresas:
    # Las piezas impresas de la PLANTA (cinta de monedas, almacén, cinta de vasos, canaleta y muelle)
    # ya no se cuentan aquí desde el 2026-10-24: son parte de la maqueta impresa (`maqueta`, abajo).
    # ---------------------------------------------------------------- carro
    - {id: cuna_carro, nombre: "Cuna del vaso (mampara, postes, brazos, asientos, lengüeta)", subsistema: Carro, componente: cuna_carro, cantidad: 1, medidas_mm: [111, 112, 89], volumen_cm3: 37.5, origen: malla, maciza: true, como: "suma de las mallas impresas de la cuna: mampara 19,3 + base 1,8 + 2 x 6,5 de postes y asientos + lengüeta 0,6 + 2,8 de detalles", tornillos: {m3x10: 6, tuerca_m3: 6}}
    - {id: escuadra_frontal_carro, nombre: "Escuadra frontal del HC-SR04 y el VL53L0X", subsistema: Carro, cantidad: 1, medidas_mm: [51, 20, 34], volumen_cm3: 6.3, origen: malla, maciza: true, tornillos: {m3x10: 2, tuerca_m3: 2, m2x8: 4}}
    - {id: soporte_encoder, nombre: "Soporte del encoder H206", subsistema: Carro, cantidad: 2, medidas_mm: [11, 9, 32], volumen_cm3: 1.0, origen: malla, maciza: true, tornillos: {m3x10: 1, tuerca_m3: 1}}
    - {id: brazo_rodillo_guia, nombre: "Brazo del rodillo guía trasero", subsistema: Carro, cantidad: 2, medidas_mm: [40, 14, 12], volumen_cm3: 3.0, origen: estimado, maciza: true, como: "bloque atornillado + brazo de 4 mm (la malla incluye los rodamientos)", tornillos: {m3x30: 1, tuerca_m3: 1, m3x10: 2}}
    - {id: caja_interruptor_carro, nombre: "Caja del interruptor y el fusible", subsistema: Carro, cantidad: 1, medidas_mm: [36, 16, 12], volumen_cm3: 3.0, origen: estimado, maciza: true, como: "caja de 36 x 16 x 12 hueca con pared de 2 mm (la malla es un sólido)", tornillos: {m3x10: 2}}
    # ---------------------------------------------------------------- caja de control
    - {id: tacos_tapa_caja, nombre: "Taco de esquina de la tapa de la caja", subsistema: Control y potencia, zona: Caja de control, cantidad: 4, medidas_mm: [14, 14, 15], volumen_cm3: 2.9, origen: malla, maciza: false, tornillos: {m4x12: 1, tuerca_m4: 1}}

  # Maqueta impresa (maqueta_impresa/, 2026-10-24): toda la estructura y las piezas de PLA de la
  # planta, medidas por su exportador (gramos y minutos por pieza, de los mismos parámetros de capa,
  # paredes y relleno del laminador). Aquí solo se dice a qué subsistema (costos) y zona (peso) va cada
  # grupo; app/costos.py lee el archivo y suma gramos x precio_kg (con el desperdicio) + horas x energía.
  maqueta:
    archivo: maqueta_impresa/piezas.json
    grupos:
      est_nodos: {nombre: "Estructura: nodos", subsistema: Estructura, zona: Estructura impresa}
      est_tubos: {nombre: "Estructura: tubos de 16 x 16", subsistema: Estructura, zona: Estructura impresa}
      est_uniones: {nombre: "Estructura: empalmes y tacos", subsistema: Estructura, zona: Estructura impresa}
      rem: {nombre: "Remaches impresos", subsistema: Estructura, zona: Estructura impresa}
      mon: {nombre: "Cinta de monedas", subsistema: Cinta de monedas, zona: Cinta de monedas}
      alm: {nombre: "Almacén de monedas", subsistema: Cinta de monedas, zona: Almacén}
      vas: {nombre: "Cinta de vasos", subsistema: Cinta de vasos, zona: Cinta de vasos}
      tap: {nombre: "Tapas, prensa y empujador", subsistema: Cinta de vasos, zona: Pórtico}
      can: {nombre: "Canaleta y muelle", subsistema: Canaleta y muelle, zona: Canaleta y muelle}

  # Tornillería. `uniones` = lo que la maqueta impresa no une con remaches (todo lo demás va remachado:
  # sin escuadras, pies ni tuercas en T); lo de cada pieza impresa del carro y de la caja está en su
  # `tornillos`. Los servos usan los tornillos de su kit. Se compra un `repuesto` de más.
  tornilleria:
    repuesto: 0.10
    tipos:
      m5x10: {nombre: "Tornillo M5 x 10 cabeza Allen", precio: 350, masa_g: 3, fuente: estimado, tienda: ferretronica}
      m5x16: {nombre: "Tornillo M5 x 16 cabeza Allen (rodamientos KFL08)", precio: 400, masa_g: 3.5, fuente: estimado, tienda: ferretronica}
      tuerca_m5: {nombre: "Tuerca M5", precio: 100, masa_g: 1.2, fuente: estimado, tienda: ferretronica}
      m4x12: {nombre: "Tornillo M4 x 12", precio: 250, masa_g: 2, fuente: estimado, tienda: ferretronica}
      tuerca_m4: {nombre: "Tuerca M4", precio: 80, masa_g: 0.8, fuente: estimado, tienda: ferretronica}
      m3x10: {nombre: "Tornillo M3 x 10", precio: 150, masa_g: 1, fuente: estimado, tienda: ferretronica}
      m3x30: {nombre: "Tornillo M3 x 30", precio: 250, masa_g: 2, fuente: estimado, tienda: ferretronica}
      tuerca_m3: {nombre: "Tuerca M3", precio: 50, masa_g: 0.4, fuente: estimado, tienda: ferretronica}
      m2x8: {nombre: "Tornillo M2 x 8 autorroscante (servos, placas)", precio: 100, masa_g: 0.3, fuente: estimado, tienda: ferretronica}
    uniones:
      - {zona: Cinta de monedas, nombre: "NEMA 17 de la cinta de monedas a su jaula impresa (agujeros de 3,4 mm a 31 mm)", tornillos: {m3x10: 4}}
      - {zona: Cinta de vasos, nombre: "NEMA 17 de la cinta de vasos a su placa (4 M3) y 4 rodamientos KFL08 (2 M5 con tuerca c/u)", tornillos: {m3x10: 4, m5x16: 8, tuerca_m5: 8}}

# Dónde abaratar (PROPUESTAS: el diseño NO se cambia sin que el grupo lo apruebe). `aplicado: true` =
# ya está en el diseño y en el total (aprobado por el usuario el 2026-10-24).
# riesgo: bajo = mismo comportamiento; medio = funciona pero hay que medir algo; alto = cambia el diseño.
ahorros:
  - id: nema17_ml
    titulo: "NEMA 17 en Mercado Libre y no en tienda especializada"
    ahorro: 41800
    riesgo: bajo
    detalle: "El mismo 17HS4401 cuesta 59 000 en Mercado Libre y 79 900 en Electronilab (x2). Ya está contado al precio bajo."
  - id: quitar_capacitivo
    titulo: "Quitar el sensor capacitivo"
    ahorro: 40606
    riesgo: medio
    detalle: "Con el filtro total, que haya pieza ya lo dice el infrarrojo de presencia (E1); no metálico = presencia sí e inductivo no. Se ahorran el LJC18A3 (32 606) y un canal del optoacoplador (~8 000). Se pierde la segunda confirmación de que la pieza sigue en la casilla en E2."
  - id: maqueta_impresa
    titulo: "Estructura impresa (maqueta_impresa/) en vez de perfil 2020, escuadras, pies, placas de aluminio, acrílico y MDF"
    # ahorro = antes - (maqueta + tornillería de hoy): lo calcula app/costos.py con piezas.json (no escribirlo a mano:
    # cambia cada vez que la maqueta se aligera)
    antes: 793087
    riesgo: medio
    aplicado: true
    detalle: "Antes: 7 barras de V-Slot (398 300), tornillería con 24 escuadras, 15 pies y tuercas en T (219 280), las piezas impresas sueltas de la planta (90 507), tubos de acrílico (45 000) y tablero MDF (40 000) = 793 087. Ahora: la maqueta impresa (los gramos y horas de maqueta_impresa/piezas.json, a precio de PLA + energía) y la tornillería que no va remachada (12 150). Lo funcional no cambia; los remaches se prueban al imprimir (maqueta_impresa/README.md)."
  - id: pca9685_directo
    titulo: "Servos directo al PWM del ESP32 (sin PCA9685)"
    ahorro: 29500
    riesgo: alto
    detalle: "El ESP32 tiene 16 canales LEDC, pero el fijo ya usa 19 de sus ~25 pines útiles: 6 servos más no caben sin quitar otra cosa. No recomendado."
  - id: buck_5a
    titulo: "Buck de 5 A (XL4015) en vez del XL4016 de 9 A para los servos"
    ahorro: 16900
    riesgo: medio
    aplicado: true
    detalle: "Pico simulado del riel de 6 V: 3,9 A (prensa apretando la tapa). Prensa y empujador nunca arrancan a la vez (firmware/fijo/estacion.py, EXCLUYENTES, con su prueba). Medir el pico real en el montaje."
  - id: fuente_5a
    titulo: "Fuente de 12 V 5 A en vez de 10 A"
    ahorro: 31000
    riesgo: bajo
    aplicado: true
    detalle: "Pico simulado del +12 V: 3,3 A; peor caso con el XL4015 en su límite de corriente: 4,1 A. El precio de la de 5 A es estimado."
  - id: empalmes
    titulo: "Empalmes soldados en vez de la bornera X2, los optoacopladores y el reparto I2C"
    ahorro: 27000
    riesgo: bajo
    aplicado: true
    detalle: "Misma topología (GND en estrella en los bornes -V de la fuente). Los M18 van al GPIO con un diodo BAT85 y una pull-up de 10 kΩ (sigue activo en bajo); el bus I2C 1 con sus dos pull-ups de 2,2 kΩ en línea. Se pierde el aislamiento del optoacoplador y desarmar es con cautín."
  - id: sin_hub_usb
    titulo: "Sin hub USB: ESP32 y webcams directo al portátil"
    ahorro: 23500
    riesgo: bajo
    aplicado: true
    detalle: "Hacen falta 3 puertos USB libres en el portátil; ninguno pide más de 0,35 A (un USB 2.0 da 0,5 A)."
  - id: bridas
    titulo: "Bridas con bases adhesivas en vez de canaletas ranuradas y prensaestopas"
    ahorro: 11000
    riesgo: bajo
    aplicado: true
    detalle: "25 000 de canaleta y prensaestopas contra 14 000 de bridas, bases y el ventilador (que antes no estaba contado). El ventilador se queda: los A4988 van a 1 A por fase, el límite sin aire forzado (docs/electrica.md)."
  - id: un_fusible
    titulo: "Un fusible principal y cable de poder a una multitoma con interruptor (sin IEC ni 4 portafusibles)"
    ahorro: 6900
    riesgo: bajo
    aplicado: true
    detalle: "9 200 de 4 portafusibles + 6 000 de la entrada IEC contra 2 300 de un portafusible + 6 000 del cable con enchufe. El fusible de 5 A cubre el pico simulado del +12 V (3,3 A) y el peor caso (4,1 A)."
  - id: una_camara
    titulo: "Webcam de 720p también en la cámara cenital"
    ahorro: 15000
    riesgo: medio
    detalle: "La cámara cenital mide diámetros de monedas (±0,5 mm): con 720p a la misma altura la resolución baja de ~0,05 a ~0,08 mm/píxel. Probar con fotos reales antes (fase 5)."
  - id: baterias_par
    titulo: "Comprar las 18650 en par"
    ahorro: 4000
    riesgo: bajo
    detalle: "El par cuesta 60 000 contra 2 x 32 000. Ya está contado al precio del par."
