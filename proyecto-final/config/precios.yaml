  # Perfil 2020: cada tramo con su largo MEDIDO en el modelo (las mallas `perfil_2020` y `viga` del
  # visor, 2026-09-28). Los postes de las dos cámaras no son malla de perfil sino caja: se midió su
  # alto en el modelo (poste cenital: 262 mm con abrazadera y pie; el de la cámara de vasos: 190).
  perfil:
    largo_barra_mm: 1000        # se compra en barras de 1 m
    corte_mm: 3                 # lo que se come la sierra en cada corte
    kg_por_m: 0.50              # V-Slot 2020 (hoja de datos: 0,49-0,51 kg/m)
    tramos:
      - {zona: Cinta de monedas, nombre: "Larguero del riel de la cinta de monedas", largo_mm: 251, cantidad: 2}
      - {zona: Cinta de monedas, nombre: "Pata de la mesa de monedas", largo_mm: 418, cantidad: 3}
      - {zona: Cinta de monedas, nombre: "Travesaño de la cola (a lo ancho)", largo_mm: 61, cantidad: 1}
      - {zona: Cinta de monedas, nombre: "Travesaño lateral (a lo largo)", largo_mm: 155, cantidad: 1}
      - {zona: Cinta de monedas, nombre: "Poste de la compuerta de desvío E4", largo_mm: 377, cantidad: 1}
      - {zona: Cinta de monedas, nombre: "Poste de la cámara cenital", largo_mm: 240, cantidad: 1}
      - {zona: Cinta de monedas, nombre: "Brazo de la cámara cenital", largo_mm: 70, cantidad: 1}
      - {zona: Cinta de vasos, nombre: "Pata de la mesa de vasos", largo_mm: 88, cantidad: 4}
      - {zona: Cinta de vasos, nombre: "Larguero de la mesa de vasos", largo_mm: 340, cantidad: 2}
      - {zona: Cinta de vasos, nombre: "Travesaño de la mesa de vasos", largo_mm: 40, cantidad: 2}
      - {zona: Cinta de vasos, nombre: "Poste de la cámara de vasos", largo_mm: 190, cantidad: 1}
      - {zona: Pórtico, nombre: "Columna del pórtico", largo_mm: 398, cantidad: 2}
      - {zona: Pórtico, nombre: "Viga del pórtico (a 40 cm)", largo_mm: 330, cantidad: 1}
      - {zona: Canaleta y muelle, nombre: "Poste alto de la canaleta", largo_mm: 163, cantidad: 2}
      - {zona: Canaleta y muelle, nombre: "Poste bajo de la canaleta", largo_mm: 137, cantidad: 2}
      - {zona: Canaleta y muelle, nombre: "Travesaño de la canaleta", largo_mm: 105, cantidad: 2}
      - {zona: Canaleta y muelle, nombre: "Larguero de la canaleta", largo_mm: 78, cantidad: 2}
      - {zona: Canaleta y muelle, nombre: "Poste del escape de la canaleta", largo_mm: 43, cantidad: 1}

  # Tornillería. `uniones` = lo de la estructura de perfil (contado en el modelo: 22 escuadras con
  # 44 tornillos M5 y 15 pies niveladores; + 2 escuadras de los postes de las cámaras); lo de cada
  # pieza impresa está en su `tornillos`. Se compra un `repuesto` de más (se pierden, se barren).
  tornilleria:
    repuesto: 0.10
    tipos:
      escuadra_2020: {nombre: "Escuadra 2020 de fundición", precio: 2500, masa_g: 14, fuente: estimado, tienda: mercadolibre}
      pie_nivelador: {nombre: "Pie nivelador M6 Ø26 con contratuerca", precio: 3500, masa_g: 20, fuente: estimado, tienda: mercadolibre}
      tuerca_t: {nombre: "Tuerca en T M5 (martillo) para 2020", precio: 450, masa_g: 2, fuente: estimado, tienda: mercadolibre}
      m5x8: {nombre: "Tornillo M5 x 8 ISO 7380 (escuadras)", precio: 300, masa_g: 2.5, fuente: estimado, tienda: ferretronica}
      m5x10: {nombre: "Tornillo M5 x 10 cabeza Allen", precio: 350, masa_g: 3, fuente: estimado, tienda: ferretronica}
      m4x12: {nombre: "Tornillo M4 x 12 (o autorroscante para MDF)", precio: 250, masa_g: 2, fuente: estimado, tienda: ferretronica}
      tuerca_m4: {nombre: "Tuerca M4", precio: 80, masa_g: 0.8, fuente: estimado, tienda: ferretronica}
      m3x10: {nombre: "Tornillo M3 x 10", precio: 150, masa_g: 1, fuente: estimado, tienda: ferretronica}
      m3x30: {nombre: "Tornillo M3 x 30", precio: 250, masa_g: 2, fuente: estimado, tienda: ferretronica}
      tuerca_m3: {nombre: "Tuerca M3", precio: 50, masa_g: 0.4, fuente: estimado, tienda: ferretronica}
      m2x8: {nombre: "Tornillo M2 x 8 autorroscante (servos, placas)", precio: 100, masa_g: 0.3, fuente: estimado, tienda: ferretronica}
    uniones:
      - {zona: Cinta de monedas, nombre: "Mesa de monedas (4 escuadras, 3 pies) + poste E4 (1 pie) + poste cenital (1 escuadra)", tornillos: {escuadra_2020: 5, m5x8: 10, tuerca_t: 10, pie_nivelador: 4}}
      - {zona: Cinta de vasos, nombre: "Mesa de vasos (8 escuadras, 4 pies) + poste de la cámara de vasos (1 escuadra)", tornillos: {escuadra_2020: 9, m5x8: 18, tuerca_t: 18, pie_nivelador: 4}}
      - {zona: Pórtico, nombre: "Pórtico (2 escuadras bajo la viga, 2 pies)", tornillos: {escuadra_2020: 2, m5x8: 4, tuerca_t: 4, pie_nivelador: 2}}
      - {zona: Canaleta y muelle, nombre: "Soportes de la canaleta (8 escuadras, 4 pies) + poste del escape (1 pie)", tornillos: {escuadra_2020: 8, m5x8: 16, tuerca_t: 16, pie_nivelador: 5}}

# Dónde abaratar (PROPUESTAS: el diseño NO se cambia sin que el grupo lo apruebe).
# riesgo: bajo = mismo comportamiento; medio = funciona pero hay que medir algo; alto = cambia el diseño.
ahorros:
  - id: nema17_ml
    titulo: "NEMA 17 en Mercado Libre y no en tienda especializada"
    ahorro: 41800
    riesgo: bajo
    detalle: "El mismo 17HS4401 cuesta 59 000 en Mercado Libre y 79 900 en Electronilab (x2). Ya está contado al precio bajo."
  - id: quitar_capacitivo
    titulo: "Quitar el sensor capacitivo"
    ahorro: 40606
    riesgo: medio
    detalle: "Con el filtro total, que haya pieza ya lo dice el infrarrojo de presencia (E1); no metálico = presencia sí e inductivo no. Se ahorran el LJC18A3 (32 606) y un canal del optoacoplador (~8 000). Se pierde la segunda confirmación de que la pieza sigue en la casilla en E2."
  - id: perfil_por_tubo
    titulo: "Pórtico en tubo cuadrado de aluminio de ferretería en vez de perfil 2020"
    ahorro: 290000
    riesgo: medio
    detalle: "Los 6,1 m de perfil medidos en el modelo 3D salen en 7 barras de V-Slot (398 300); 7 m de tubo cuadrado de 3/4\" cuestan ~105 000 en ferretería (~15 000/m, estimado). Se pierde lo modular (tuercas en T): hay que taladrar y ajustar alturas a mano, y las escuadras de fundición ya no sirven tal cual."
  - id: pca9685_directo
    titulo: "Servos directo al PWM del ESP32 (sin PCA9685)"
    ahorro: 29500
    riesgo: alto
    detalle: "El ESP32 tiene 16 canales LEDC, pero el fijo ya usa 19 de sus ~25 pines útiles: 6 servos más no caben sin quitar otra cosa. No recomendado."
  - id: buck_5a
    titulo: "Buck de 5 A (XL4015) en vez del XL4016 de 9 A para los servos"
    ahorro: 16900
    riesgo: medio
    detalle: "Alcanza si prensa y empujador (MG996R, ~2,5 A de arranque cada uno) no arrancan a la vez; hoy la lógica los mueve en momentos distintos, pero hay que medir el pico real."
  - id: una_camara
    titulo: "Webcam de 720p también en la cámara cenital"
    ahorro: 15000
    riesgo: medio
    detalle: "La cámara cenital mide diámetros de monedas (±0,5 mm): con 720p a la misma altura la resolución baja de ~0,05 a ~0,08 mm/píxel. Probar con fotos reales antes (fase 5)."
  - id: baterias_par
    titulo: "Comprar las 18650 en par"
    ahorro: 4000
    riesgo: bajo
    detalle: "El par cuesta 60 000 contra 2 x 32 000. Ya está contado al precio del par."
