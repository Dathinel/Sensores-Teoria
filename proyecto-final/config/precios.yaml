# Dónde abaratar (PROPUESTAS: el diseño NO se cambia sin que el grupo lo apruebe).
# riesgo: bajo = mismo comportamiento; medio = funciona pero hay que medir algo; alto = cambia el diseño.
ahorros:
  - id: nema17_ml
    titulo: "NEMA 17 en Mercado Libre y no en tienda especializada"
    ahorro: 41800
    riesgo: bajo
    detalle: "El mismo 17HS4401 cuesta 59 000 en Mercado Libre y 79 900 en Electronilab (x2). Ya está contado al precio bajo."
  - id: quitar_capacitivo
    titulo: "Quitar el sensor capacitivo"
    ahorro: 40606
    riesgo: medio
    detalle: "Con el filtro total, que haya pieza ya lo dice el infrarrojo de presencia (E1); no metálico = presencia sí e inductivo no. Se ahorran el LJC18A3 (32 606) y un canal del optoacoplador (~8 000). Se pierde la segunda confirmación de que la pieza sigue en la casilla en E2."
  - id: perfil_por_tubo
    titulo: "Pórtico en tubo cuadrado de aluminio de ferretería en vez de perfil 2020"
    ahorro: 120000
    riesgo: medio
    detalle: "3 m de perfil V-Slot cuestan ~170 700; tubo cuadrado de 3/4\" cuesta ~15 000/m en ferretería. Se pierde lo modular (tuercas en T): hay que taladrar y ajustar alturas a mano."
  - id: pca9685_directo
    titulo: "Servos directo al PWM del ESP32 (sin PCA9685)"
    ahorro: 29500
    riesgo: alto
    detalle: "El ESP32 tiene 16 canales LEDC, pero el fijo ya usa 19 de sus ~25 pines útiles: 6 servos más no caben sin quitar otra cosa. No recomendado."
  - id: buck_5a
    titulo: "Buck de 5 A (XL4015) en vez del XL4016 de 9 A para los servos"
    ahorro: 16900
    riesgo: medio
    detalle: "Alcanza si prensa y empujador (MG996R, ~2,5 A de arranque cada uno) no arrancan a la vez; hoy la lógica los mueve en momentos distintos, pero hay que medir el pico real."
  - id: una_camara
    titulo: "Webcam de 720p también en la cámara cenital"
    ahorro: 15000
    riesgo: medio
    detalle: "La cámara cenital mide diámetros de monedas (±0,5 mm): con 720p a la misma altura la resolución baja de ~0,05 a ~0,08 mm/píxel. Probar con fotos reales antes (fase 5)."
  - id: baterias_par
    titulo: "Comprar las 18650 en par"
    ahorro: 4000
    riesgo: bajo
    detalle: "El par cuesta 60 000 contra 2 x 32 000. Ya está contado al precio del par."
