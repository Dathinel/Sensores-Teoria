# -------------------------------------------------------------------------------------------
# Datos para las comprobaciones de par y de carga (docs/peso.md). Lo que no es medible todavía
# va marcado PROVISIONAL y se dice en el documento.
# -------------------------------------------------------------------------------------------
comprobaciones:
  g: 9.81
  nema17:
    par_retencion_nm: 0.40        # 17HS4401: 40 N·cm de retención a 1,7 A (hoja de datos)
    corriente_nominal_a: 1.7
    corriente_driver_a: 1.0       # A4988 sin ventilador: se ajusta a ~1 A para que no se caliente (PROVISIONAL)
    par_util_frac: 0.5            # a ~100 rpm el par que sostiene un paso a paso cae a ~la mitad del de retención
    inercia_rotor_kg_m2: 5.4e-6   # 54 g·cm² (hoja de datos)
    mu_banda_cama: 0.6            # caucho sobre la cama de MDF/PLA, en seco: peor caso (0,4-0,6)
    tension_banda_n: 20           # tensión de montaje de cada ramal: PROVISIONAL (se ajusta con el tensor)
    mu_rodamiento: 0.0015         # rodamiento de bolas (608ZZ / KFL08), hoja de datos
    radio_eje_m: 0.004            # eje de 8 mm
    # El tiempo de cada avance y el largo de la casilla se leen de config/parametros.yaml
    # (tiempos_ms y separacion_casilla_mm): no se repiten aquí.
    casillas_monedas_cargadas: 10 # ~430 mm de banda / 40 mm: peor caso, todas con una moneda de 1000 (10 g)
    masa_moneda_max_g: 10.0       # la más pesada de config/monedas.yaml
    vasos_cargados: 5             # 400 mm / 80 mm: peor caso, todos llenos
    radio_rodillo_modelo_m: 0.011 # Ø22 del modelo 3D (retorno de la banda, 2026-09-27)
  mg996r:
    par_bloqueo_nm_4v8: 0.92      # 9,4 kg·cm a 4,8 V (hoja de datos)
    par_bloqueo_nm_6v: 1.08       # 11 kg·cm a 6 V (hoja de datos); el buck de servos da 6 V
    excentricidad_m: 0.0065       # leva de la prensa (catálogo)
    fuerza_tapa_n: [30, 50]       # lo que pide una tapa a presión: PROVISIONAL (catálogo)
    # Fuerza OBJETIVO de la prensa (usuario 2026-09-28: decidirla según cómo sella la tapa). La
    # tapa sella a presión (snap-fit): su reborde se abre y "salta" sobre el labio del vaso; eso
    # pide ~30-50 N, y pasado el salto no hace falta más (apretar más solo deforma el vaso de
    # plástico). Objetivo = 50 N x 1,2 de margen = 60 N, y el RESORTE LIMITADOR del plato se
    # elige para que al final de la carrera no pase de ahí (un objeto extraño tampoco recibe
    # más). Antes decía "≥150 N" (catálogo): el MG996R con la leva de 6,5 mm no lo sostiene a
    # 90° de la leva y tampoco hace falta. Con 60 N el MG996R queda con margen >x2 a 6 V.
    fuerza_prensa_objetivo_n: 60
    radio_manivela_m: 0.035       # empujador: carrera de ~70 mm = 2 x radio
    mu_vaso_banda: 0.6
  carro:
    par_motor_nm: 0.08            # TT 1:48: ~0,8 kg·cm de par de arranque a 6 V (hoja de datos de los kits: 0,08 N·m)
    # El radio de la rueda, la velocidad sin carga (firmware.carro_v_max_m_s), la aceleración máxima
    # y la masa que usa la simulación se leen de config/parametros.yaml (vehiculo y firmware).
    crr: 0.03                     # resistencia a la rodadura: llanta de goma + rueda loca sobre la lámina (estimado)
    mu_llanta: 0.7                # goma sobre cartón/vinilo (estimado)
    fraccion_peso_ruedas: 0.7     # parte del peso sobre las ruedas motrices (la rueda loca lleva el resto): estimado
    altura_cg_m: 0.045            # centro de masa del carro cargado sobre el piso: estimado
    distancia_cg_apoyo_m: 0.060   # del centro de masa al apoyo hacia el que volcaría al frenar: estimado
    vaso_altura_cg_m: 0.045       # vaso lleno: las monedas abajo, centro de masa a media altura o menos
    masa_vaso_vacio_g: 25         # vaso opaco impreso/PP de Ø62 x 90 mm: estimado (PESAR)
    masa_tapa_g: 8                # tapa de 78 mm: estimado       # vaso lleno: las monedas abajo, centro de masa a media altura o menos
