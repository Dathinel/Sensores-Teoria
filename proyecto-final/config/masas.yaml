  capacitivo: {zona: Cinta de monedas, masa_g: 60, fuente: estimado, como: "cuerpo M18 x 60 mm con 2 tuercas + 1 m de cable"}
  inductivo: {zona: Cinta de monedas, masa_g: 55, fuente: estimado, como: "LJ18A3-8: cuerpo M18 con tuercas + 1 m de cable"}
  camara: {zona: Cinta de monedas, masa_g: 110, fuente: estimado, como: "webcam 1080p con su cable (~80 g) + anillo LED (~30 g)"}
  servo_desvio_e7: {zona: Cinta de monedas, masa_g: 9, fuente: hoja_de_datos, como: "SG90: 9 g"}
  canaletas_rechazo: {zona: Cinta de monedas, impreso: true}
  canal_e7: {zona: Cinta de monedas, impreso: true}
  cinta_monedas: {zona: Cinta de monedas, masa_g: 0, fuente: estimado, como: "banda, rodillos y rodamientos van desglosados en `otros`"}
  # --- almacén
