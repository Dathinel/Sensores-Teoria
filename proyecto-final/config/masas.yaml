# -------------------------------------------------------------------------------------------
# Lo que no es un componente del catálogo pero pesa: bandas, rodillos, rodamientos, bastidores,
# gabinete, chasis, tablero, cables. Cada uno con masa_g, o con material + volumen_cm3 (la masa
# se calcula: volumen x densidad del material).
# -------------------------------------------------------------------------------------------
otros:
  # --- cinta de monedas (en detalle: es la que carga el NEMA 17 más exigido por la precisión)
  - {id: banda_monedas, zona: Cinta de monedas, nombre: "Banda de caucho de 55 mm (cerrada)", material: caucho, volumen_cm3: 50.7, fuente: estimado, como: "largo ~615 mm (línea media del casco del motriz, el tensor y los retornos A y B de cinta_monedas.scad: 611,5 con el tensor en x 86 y 618 en x 90; segunda opinión 2026-10-25) x 55 mm x 1,5 mm de espesor. Antes 638 (contaba el retorno C, que queda dentro del lazo) y 930 (la cinta vieja de 2 rodillos)"}
  - {id: rodillos_monedas, zona: Cinta de monedas, nombre: "Rodillos Ø22 x 59 mm con su eje de 8 mm (x2)", masa_g: 76, fuente: estimado, como: "tubo de aluminio Ø22 pared 1 mm: π·22·59·1 = 4,1 cm³ x 2,7 = 11 g + eje de acero Ø8 x 68: 3,4 cm³ x 7,85 = 27 g; = 38 g por rodillo"}
  - {id: rodamientos_608_monedas, zona: Cinta de monedas, nombre: "Rodamientos 608ZZ (x4)", masa_g: 48, fuente: hoja_de_datos, como: "608ZZ: 12 g c/u"}
  - {id: rodillos_retorno_monedas, zona: Cinta de monedas, nombre: "Rodillos de retorno A y B (Ø22 x 59) con sus ejes Ø8 fijos", masa_g: 100, fuente: estimado, como: "2 tubos de aluminio Ø22 pared 1 mm: π·22·59·1 = 4,1 cm³ x 2,7 = 11 g c/u; ejes de acero Ø8 de 114 (A: cuelga de las bajadas de los bloques del motriz) y 84,3 mm (B) de cinta_monedas.scad: π·4²·198,3 = 10,0 cm³ x 7,85 = 78 g. Sin el retorno C (2026-10-25: quedaba dentro del lazo y no tocaba la banda)"}
  - {id: acople_monedas, zona: Cinta de monedas, nombre: "Acople flexible 5 a 8 mm", masa_g: 9, fuente: hoja_de_datos, como: "acople helicoidal de aluminio Ø19 x 25"}
  - {id: separadores_monedas, zona: Cinta de monedas, nombre: "Separadores de casilla de la banda (15, a L/15 ≈ 41 mm)", masa_g: 15, fuente: estimado, como: "una banda cerrada solo tiene casillas iguales si su largo es N x paso: ~615 mm / 15 = 41 mm (quedan 38 mm libres para la moneda de Ø26,7; con 16 cada 40 sobraba una casilla de ~15-18 mm). Listón de caucho de 55 x 3 x 4 mm: 0,7 cm³ x 1,3 ≈ 1 g c/u"}
