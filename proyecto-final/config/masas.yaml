  - {id: cables_caja, zona: Caja de control, nombre: "Cables de la caja y de campo (18 AWG, dupont, JST)", masa_g: 250, fuente: estimado, como: "~15 m de cable de 18-24 AWG entre caja, planta y sensores"}
