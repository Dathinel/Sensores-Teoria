  - {id: rodillos_vasos, zona: Cinta de vasos, nombre: "Rodillos Ø22 x 79 mm con su eje (x2)", masa_g: 90, fuente: estimado, como: "igual que los de monedas pero de 79 mm: ~45 g por rodillo"}
  - {id: rodamientos_kfl08, zona: Cinta de vasos, nombre: "Rodamiento con brida KFL08 (x1) y rodamientos 608ZZ (x3)", masa_g: 66, fuente: hoja_de_datos, como: "KFL08 de zamak ~30 g (eje motriz, lateral -y) + 3 x 608ZZ de 12 g (cinta_vasos.scad)"}
  - {id: acople_vasos, zona: Cinta de vasos, nombre: "Acople flexible 5 a 8 mm", masa_g: 9, fuente: hoja_de_datos}
  - {id: separadores_prensa, zona: Cinta de vasos, nombre: "Varillas guía Ø8 del empujador (x2) y separadores de nailon de 3 mm del NEMA (x4)", masa_g: 82, fuente: estimado, como: "varillas de acero Ø8 x 102,5 mm: 5,2 cm³ x 7,85 = 40 g c/u; separadores de nailon ~0,5 g. Los postes del motor (32,8 mm) son impresos: van en vas_lat_s_a"}
  # --- almacén
  - {id: rodamiento_608_almacen, zona: Almacén, nombre: "Rodamiento 608ZZ del eje del carrusel (en la placa fija)", masa_g: 12, fuente: hoja_de_datos, como: "608ZZ: 12 g (almacen.scad)"}
  # --- pórtico
  # --- canaleta y muelle
  - {id: espuma_topes, zona: Canaleta y muelle, nombre: "Espuma de los topes y cinta de PTFE", masa_g: 8, fuente: estimado}
