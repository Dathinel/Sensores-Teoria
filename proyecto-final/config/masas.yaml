# Masa de todo el montaje (usuario, 2026-09-28: "peso total del montaje").
#
# Fuente única: app/masas.py suma esto y app/documentos.py genera docs/peso.md. Lo que YA está
# contado en config/precios.yaml no se repite aquí: las piezas impresas (sus gramos salen de la
# misma cuenta del costo), la maqueta impresa (gramos de maqueta_impresa/piezas.json, por grupo) y la
# tornillería contada (cantidad x masa de cada tipo). Desde el 2026-10-24 no hay perfil 2020, ni
# placas de aluminio, ni acrílico en la planta, ni tablero MDF: todo eso es la maqueta impresa.
#
# `fuente`: hoja_de_datos = masa publicada por el fabricante o la tienda; estimado = calculada
# con material x volumen (se dice cómo en `como`) o comparada con un producto parecido: PESAR
# antes de confiar en ella. Masa POR UNIDAD, en gramos; la cantidad sale del catálogo
# (sim/catalogos.py) si no está aquí.
#
# `zona`: el subsistema de docs/peso.md (el montaje se pesa por partes: así se sabe cuánto carga
# cada mesa, cada motor y el carro). Nombres de zona: Cinta de monedas, Almacén, Cinta de vasos,
# Pórtico, Canaleta y muelle, Estructura impresa, Carro, Caja de control, Pista.

consultado: "2026-09-28"

materiales:                   # densidades para las cuentas de volumen (g/cm³)
  acrilico: 1.19
  aluminio: 2.70
  acero: 7.85
  caucho: 1.30                # banda de caucho con lona (típico 1,2-1,5)
  carton: 0.70

# -------------------------------------------------------------------------------------------
