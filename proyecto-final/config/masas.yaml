  hub_usb: {zona: Caja de control, masa_g: 45, fuente: estimado, como: "hub de 4 puertos con su cable (el adaptador de pared no va en la caja)"}
  canaletas_caja: {zona: Caja de control, masa_g: 70, fuente: estimado, como: "1 m de canaleta ranurada 25 x 30 (~40 g) + 8 prensaestopas (~3 g c/u) + ventilador 4010 (~6 g)"}
